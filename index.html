/* ===== Level 3: launch + Mars ===== */

.hotkeys { position: absolute; left: 50%; bottom: 80px; transform: translateX(-50%); font-size: 13px; font-weight: 800; color: #fffaf0; background: rgba(16,26,51,.55); padding: 4px 12px; border-radius: 10px; pointer-events: none; white-space: nowrap; max-width: 92vw; overflow: hidden; text-overflow: ellipsis; }

.evbig { font-size: 74px; line-height: 1; text-align: center; }

.radvig { position: absolute; inset: 0; pointer-events: none; box-shadow: inset 0 0 120px 50px rgba(220,40,30,.75); animation: radp 1.2s infinite; z-index: 6; }
@keyframes radp { 50% { opacity: .55; } }
.recipes small { display: block; font-size: 12px; color: var(--muted); font-weight: 700; }
.deb { display: flex; flex-direction: column; gap: 6px; text-align: start; max-height: 46vh; overflow: auto; }
.drow { display: grid; grid-template-columns: 44px 1fr; gap: 10px; align-items: center; padding: 8px 10px; border-radius: 12px; background: #f1fae2; }
.drow.bad { background: #fdebe8; }
.drow .dic { position: relative; } .drow .dic i { position: absolute; right: -4px; bottom: -4px; }
.drow b { display: block; color: var(--navy); } .drow small { display: block; color: var(--muted); font-size: 12.5px; line-height: 1.35; }
.slab { display: flex; justify-content: center; gap: 14px; font-size: 12px; font-weight: 800; color: var(--muted); } .slab .on { color: #c98a00; }
.m4mc { display: flex; justify-content: space-between; align-items: center; gap: 6px; font-weight: 900; color: var(--navy); font-size: 13px; border-top: 2px dashed #ece4d4; padding-top: 5px; }
.m4mc .bag { display: flex; gap: 6px; } .m4mc .bagi { display: inline-flex; align-items: center; gap: 1px; }
.m4btns { display: grid; grid-template-columns: 1fr 1fr; gap: 5px; } .m4btns .btn { pointer-events: auto; padding: 5px 6px 4px; font-size: 12.5px; display: inline-flex; align-items: center; justify-content: center; gap: 4px; }
.m4btns .btn.on, .stabs .btn.on { background: #ffc22e; color: #1f3a68; }
.rep { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 10px 0; }
.rep .rt { background: #f6f1e6; border-radius: 12px; padding: 8px 6px; display: flex; flex-direction: column; align-items: center; gap: 1px; font-weight: 800; color: var(--navy); }
.rep .rt.low { background: #fdebe8; } .rep .rt.good { background: #eef8dc; }
.rep .rt small { font-size: 11.5px; color: var(--muted); } .rep .rt b { font-size: 20px; } .rep .up { color: #3c8a1a !important; } .rep .dn { color: #c0392b !important; }
.tasks4 { display: flex; flex-direction: column; gap: 6px; text-align: start; margin: 8px 0; }
.tasks4 div { display: flex; gap: 8px; align-items: center; background: #f6f1e6; border-radius: 10px; padding: 6px 10px; font-weight: 800; color: var(--navy); font-size: 14px; }
.tasks4 div.ok { background: #eef8dc; } .tasks4 div.bad { background: #fdebe8; }

.pz5 { border: 0; background: #fffaf0; color: #1f3a68; border-radius: 8px; width: 26px; height: 22px; font-size: 13px; cursor: pointer; box-shadow: 0 2px 0 #1f3a6833; }
.pz5.on { background: #ffc22e; }
.fprev { text-align: center; margin: 4px 0 6px; } .fprev img { width: 200px; height: 125px; border-radius: 8px; box-shadow: 0 3px 0 #1f3a6844; }
.flaggrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(86px, 1fr)); gap: 6px; max-height: 260px; overflow: auto; padding: 2px; }
.fl5 { border: 2px solid transparent; background: #fffaf0; border-radius: 10px; padding: 4px; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 2px; font: 700 11px inherit; color: #1f3a68; }
.fl5 img { width: 64px; height: 40px; border-radius: 3px; box-shadow: 0 1px 2px #0003; } .fl5.sel, .sw5.sel, .pt5.sel { border-color: #ffc22e; box-shadow: 0 0 0 2px #ffc22e; }

.nm5 { display: flex; align-items: center; gap: 6px; margin-top: 10px; font-weight: 700; color: #1f3a68; }
.ev3 { display: grid !important; grid-template-columns: repeat(3, 1fr); gap: 8px; } @media (max-width: 560px) { .ev3 { grid-template-columns: 1fr; } }
.evopt .tags i.tg.g { background: #e6f6c8; color: #2d4a08; } .evopt .tags i.tg.r { background: #fde0dc; color: #8a2218; }
.cd5 { display: inline-grid; place-items: center; min-width: 44px; height: 44px; border-radius: 50%; background: #ec5a50; color: #fff; font-size: 24px; vertical-align: middle; animation: pop2 1s ease-out infinite; }
.flash5 { position: absolute; inset: 0; background: #fff; pointer-events: none; z-index: 30; opacity: 0; } .flash5.go { animation: flash5 .55s ease-out; } @keyframes flash5 { 0% { opacity: .95; } 100% { opacity: 0; } }

.pbar { display: block; height: 7px; border-radius: 4px; background: #e8e1d2; margin-top: 4px; overflow: hidden; } .pbar i { display: block; height: 100%; background: #9ccc3c; }

@media (max-width: 640px) { .rep { grid-template-columns: repeat(2, 1fr); } }
@media (max-width: 700px) { .m4lab { display: none; } }
/* ===== Explorer credits, shop, rover camera flash ===== */
.coin { display: inline-block; width: 16px; height: 16px; border-radius: 50%; background: radial-gradient(circle at 35% 35%, #ffe58a, #ffc22e 60%, #d89a10); border: 2px solid #1f3a68; vertical-align: -3px; box-sizing: border-box; }
#credBtn { gap: 6px; display: inline-flex; align-items: center; font-weight: 800; }
.cred-pop { position: absolute; left: 50%; top: 30%; transform: translateX(-50%); background: rgba(16,26,51,.85); color: #ffd27a; font: 900 30px var(--f-display); padding: 10px 22px; border-radius: 20px; display: flex; gap: 10px; align-items: center; pointer-events: none; animation: credUp 1.9s ease-out forwards; z-index: 30; }

.shop-i b { color: var(--navy); font-size: 16px; } .shop-i small { color: var(--muted); font-size: 13px; line-height: 1.3; min-height: 34px; }

.shop-i .btn[disabled] { opacity: .55; cursor: default; }
.shop-note { font-size: 13px; color: var(--muted); margin: 0; text-align: center; }
.badge-big { display: flex; justify-content: center; animation: pop2 .4s ease-out; }

.cred-line { font: 800 18px var(--f-display); color: var(--navy); display: flex; gap: 8px; align-items: center; justify-content: center; margin: 0; }

@keyframes camF { 0% { opacity: .9; } 100% { opacity: 0; } }
/* ===== Level 3 cockpit tasks ===== */
.ck { display: flex; flex-direction: column; gap: 12px; }
.ck-row { display: flex; gap: 16px; align-items: stretch; flex-wrap: wrap; }
.ck-row2 { display: flex; gap: 18px; align-items: center; justify-content: center; margin-top: 8px; flex-wrap: wrap; }
.ck-seat { position: relative; width: 150px; height: 190px; background: linear-gradient(#1f3a68, #16284a); border-radius: 22px; flex: none; margin: 0 auto; }
.ck-chair { position: absolute; left: 30px; right: 30px; top: 28px; bottom: 22px; background: #ec8a3c; border-radius: 18px 18px 10px 10px; box-shadow: inset 0 -12px 0 #c96d24; }
.ck-kid { position: absolute; left: 0; right: 0; top: 34px; display: flex; justify-content: center; animation: pop2 .3s ease-out; }
.ck-buckle { position: absolute; left: 60px; top: 118px; width: 30px; height: 22px; border-radius: 6px; border: 4px dashed #ffd27a; box-sizing: border-box; }
.ck-buckle.in { border-style: solid; background: #9ccc3c; border-color: #fff; }
.ck-side { flex: 1; min-width: 230px; display: flex; flex-direction: column; gap: 10px; }
.ck-step { background: #fff; border: 3px solid #e4dccb; border-radius: 16px; padding: 10px 12px; font-weight: 800; color: var(--navy); display: flex; flex-direction: column; gap: 8px; }
.ck-step.off { opacity: .45; pointer-events: none; }
.ck-step.done { border-color: #9ccc3c; background: #f2fae6; }
.ck-step > .btn { align-self: flex-start; }
.ck-belt { width: 90px; height: 22px; border-radius: 6px; background: repeating-linear-gradient(90deg, #5f6b85 0 8px, #4a5570 8px 16px); cursor: grab; touch-action: none; border: 3px solid #1f3a68; }
.ck-belt.dragging { cursor: grabbing; } .ck-belt.in { visibility: hidden; }
.ck-sw { display: flex; gap: 8px; flex-wrap: wrap; }
.ck-tog { all: unset; cursor: pointer; padding: 8px 12px; border-radius: 12px; background: #e9edf5; border: 3px solid #c9d0de; font-weight: 800; color: var(--navy); display: flex; gap: 6px; align-items: center; }
.ck-tog .n { display: inline-grid; place-items: center; width: 22px; height: 22px; border-radius: 50%; background: #1f3a68; color: #fff; font-size: 13px; }
.ck-tog.on { background: #9ccc3c; border-color: #6fa02a; color: #fff; } .ck-tog.on .n { background: #fff; color: #6fa02a; }
.ck-go { all: unset; cursor: pointer; text-align: center; padding: 14px 20px; border-radius: 18px; background: #c9d0de; color: #fff; font: 900 22px var(--f-display); letter-spacing: .06em; }
.ck-go.ready, .ck-go:not([disabled]):not(#ckLand) { background: #d8433a; box-shadow: 0 6px 0 #9a2a22; animation: ckPulse 1.2s ease-in-out infinite; }
#ckLand { background: #c9d0de; } #ckLand.ready { background: #2f9a4a; box-shadow: 0 6px 0 #1f6a32; }
@keyframes ckPulse { 50% { transform: scale(1.04); } }
.ck-unit { width: 70px; height: 70px; border-radius: 16px; background: #fff; border: 3px solid #1f3a68; display: grid; place-items: center; cursor: grab; touch-action: none; }
.ck-slot { width: 80px; height: 80px; border-radius: 18px; border: 4px dashed #8fb8ff; display: grid; place-items: center; background: #0b1440; }
.ck-slot.in { border-style: solid; border-color: #9ccc3c; background: #f2fae6; }
.ck-dial { position: relative; width: 150px; height: 150px; border-radius: 50%; background: radial-gradient(#16284a, #0b1440); border: 4px solid #1f3a68; }
.ck-earth { position: absolute; left: 50%; top: 50%; transform: rotate(var(--a)) translateY(-62px) rotate(calc(-1 * var(--a))); margin: -13px 0 0 -13px; }
.ck-arm { position: absolute; left: 50%; top: 50%; width: 6px; height: 58px; margin-left: -3px; margin-top: -58px; background: #ffc22e; border-radius: 3px; transform-origin: 50% 100%; }
.ck-arm::after { content: ''; position: absolute; left: -9px; top: -10px; width: 24px; height: 14px; border-radius: 12px 12px 0 0; background: #fff; }
.ck-meter { display: flex; flex-direction: column; gap: 6px; align-items: center; color: var(--navy); }
.ck-bars { display: flex; gap: 4px; align-items: flex-end; height: 50px; }
.ck-bars i { width: 12px; background: #d9d2c3; border-radius: 3px; } .ck-bars i:nth-child(1) { height: 20%; } .ck-bars i:nth-child(2) { height: 40%; } .ck-bars i:nth-child(3) { height: 60%; } .ck-bars i:nth-child(4) { height: 80%; } .ck-bars i:nth-child(5) { height: 100%; }
.ck-bars i.on { background: #9ccc3c; }

.ck-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
.ck-sys { all: unset; cursor: pointer; background: #fff; border: 3px solid #c9d0de; border-radius: 16px; padding: 10px; display: flex; flex-direction: column; align-items: center; gap: 4px; text-align: center; }
.ck-sys b { color: var(--navy); } .ck-sys small { font-weight: 700; color: var(--muted); }
.ck-sys.loose { border-color: #ec5a50; background: #fde3e0; animation: alarmP 1s infinite; } .ck-sys.loose small { color: #8a1d14; }
.ck-sys.on { border-color: #9ccc3c; background: #f2fae6; } .ck-sys.on small { color: #3a7a1a; }
.ck-msg { min-height: 0; font-weight: 800; border-radius: 12px; padding: 0 12px; } .ck-msg.show { padding: 10px 12px; } .ck-msg.good { background: #f2fae6; color: #2f6a12; } .ck-msg.bad { background: #fde3e0; color: #8a1d14; }
.ck-msg:empty { display: none; }

<style>
/* Layout: a one-screen 3D game. The viewport fills the stage; rounded toy-like cards float over it for objectives, dialogue and the invitation. */

.objective { flex: 0 1 auto; min-width: 0; }

.help-btn .face::before, .help-btn .face::after { content: ""; position: absolute; top: 8px; width: 7px; height: 9px; border-radius: 50%; background: #1b1530; }

.dialog { position: absolute; left: 50%; bottom: 16px; transform: translateX(-50%); width: min(680px, calc(100% - 24px)); padding: 16px 18px 14px; display: grid; grid-template-columns: 64px 1fr; gap: 4px 14px; animation: pop .3s cubic-bezier(.2,1.4,.4,1); }
@keyframes pop { from { opacity: 0; transform: translate(-50%, 14px) scale(.96); } to { opacity: 1; transform: translateX(-50%); } }
.dialog .avatar { grid-row: 1 / 3; width: 64px; height: 64px; border-radius: 50%; background: radial-gradient(circle at 50% 40%, #c6ec6f, #8cc232); position: relative; box-shadow: inset 0 -4px 0 rgba(0,0,0,.12); }
.dialog .avatar::before, .dialog .avatar::after { content: ""; position: absolute; top: 20px; width: 15px; height: 21px; border-radius: 50%; background: #1b1530; box-shadow: inset -3px -3px 0 0 #1b1530, inset 3px 3px 0 0 rgba(255,255,255,.0); }
.dialog .avatar::before { left: 13px; transform: rotate(-12deg); } .dialog .avatar::after { right: 13px; transform: rotate(12deg); }
.dialog .avatar.narrator { background: radial-gradient(circle at 50% 40%, #ffd49a, var(--orange)); }
.dialog .avatar.narrator::before, .dialog .avatar.narrator::after { display: none; }
.dialog .who { font-family: var(--f-display); font-weight: 800; color: var(--lime-dk); font-size: 15px; line-height: 1.2; }

.dialog .next { grid-column: 2; justify-self: end; margin-top: 4px; }
[dir="rtl"] .dialog .next { justify-self: start; }

/* Full-screen overlays */
.overlay { position: absolute; inset: 0; display: grid; place-items: center; padding: 16px; background: rgba(10,16,34,.55); backdrop-filter: blur(3px); overflow-y: auto; }
.title-card { width: min(520px, 100%); padding: 26px 26px 24px; display: flex; flex-direction: column; gap: 14px; text-align: center; }
.title-card h1 { font-family: var(--f-display); font-weight: 800; font-size: 40px; line-height: 1.05; margin: 0; color: var(--navy); text-wrap: balance; }
.title-card h1 span { color: var(--orange); }
.title-card .sub { font-family: var(--f-display); font-weight: 700; color: var(--red); font-size: 18px; margin-top: -6px; }
.title-card p { margin: 0; color: var(--muted); font-size: 15.5px; }
.field { display: flex; flex-direction: column; gap: 6px; text-align: start; }
.field label { font-weight: 800; font-size: 14px; color: var(--navy); }
.field input { font: inherit; font-size: 18px; font-weight: 700; padding: 10px 14px; border-radius: 12px; border: 2px solid #d9d2c3; background: #fff; color: var(--ink); }
.field input:focus { outline: none; border-color: var(--orange); }
.field small { color: var(--muted); font-size: 12.5px; }
.lang-row { display: flex; gap: 8px; justify-content: center; }
.seg { all: unset; cursor: pointer; padding: 6px 16px; border-radius: 10px; font-weight: 800; border: 2px solid #d9d2c3; color: var(--ink); font-family: var(--f-display); }
.seg[aria-pressed="true"] { background: var(--navy); border-color: var(--navy); color: #fff; }
.seg:focus-visible { outline: 3px solid var(--sky); }
.controls-mini { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px 14px; font-size: 13.5px; color: var(--muted); font-weight: 700; }
.controls-mini b { color: var(--ink); background: #efe8da; border-radius: 6px; padding: 0 6px; }

.invite-wrap { perspective: 1200px; }
.invite { width: min(560px, calc(100vw - 48px)); padding: 30px 30px 24px; display: flex; flex-direction: column; gap: 14px; position: relative; text-align: center; transform-origin: 50% 80%; animation: unfold .9s cubic-bezier(.2,1.2,.3,1) both; background:
  radial-gradient(circle at 12% 10%, rgba(236,138,60,.10), transparent 40%), radial-gradient(circle at 90% 92%, rgba(143,208,239,.18), transparent 45%), var(--paper); border: 3px solid #efe1c4; }
@keyframes unfold { from { opacity: 0; transform: rotateX(70deg) scale(.4) translateY(80px); } to { opacity: 1; transform: none; } }
.invite .patch { width: 104px; height: 104px; margin: -4px auto 0; filter: drop-shadow(0 4px 0 rgba(0,0,0,.12)); }
.invite .eyebrow { font-weight: 800; letter-spacing: .14em; text-transform: uppercase; font-size: 12.5px; color: var(--orange-dk); }
.invite h2 { font-family: var(--f-display); font-weight: 800; font-size: 34px; line-height: 1.05; margin: 0; color: var(--navy); }
.invite .body { font-size: 17px; color: var(--ink); max-width: 46ch; margin: 0 auto; display: flex; flex-direction: column; gap: 10px; }
.invite .body p { margin: 0; }
.invite .sig { font-family: var(--f-display); font-weight: 700; color: var(--navy); }
.invite .sig small { display: block; font-family: var(--f-body); color: var(--muted); font-weight: 600; font-size: 12.5px; }
.invite .stamp { position: absolute; top: 18px; inset-inline-end: 20px; transform: rotate(10deg); border: 3px solid var(--red); color: var(--red); font-family: var(--f-display); font-weight: 800; font-size: 13px; padding: 2px 9px 0; border-radius: 8px; letter-spacing: .06em; opacity: .85; }

.chat { position: absolute; top: 70px; bottom: 16px; inset-inline-end: 14px; width: min(380px, calc(100% - 28px)); display: flex; flex-direction: column; overflow: hidden; animation: pop2 .25s ease-out; }
@keyframes pop2 { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
.chat header { display: flex; align-items: center; gap: 10px; padding: 12px 14px; border-bottom: 2px solid #efe8da; }
.chat header .t { font-family: var(--f-display); font-weight: 800; font-size: 19px; flex: 1; color: var(--navy); line-height: 1.2; }
.chat header .t small { display: block; font-family: var(--f-body); font-size: 12px; color: var(--muted); font-weight: 700; }
.chat .log { flex: 1; overflow-y: auto; padding: 12px 14px; display: flex; flex-direction: column; gap: 9px; }
.bub { max-width: 88%; padding: 8px 12px; border-radius: 14px; font-size: 15.5px; font-weight: 600; line-height: 1.45; }
.bub.nuri { background: #eaf6d2; align-self: flex-start; border-end-start-radius: 4px; }
.bub.me { background: var(--navy); color: #fff; align-self: flex-end; border-end-end-radius: 4px; }
.bub.thinking { color: var(--muted); font-style: italic; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; padding: 0 14px 10px; }
.chip { all: unset; cursor: pointer; font-size: 13.5px; font-weight: 800; color: var(--navy); background: #fff; border: 2px solid #d9d2c3; padding: 4px 11px; border-radius: 999px; }
.chip:hover { border-color: var(--orange); }
.chip:focus-visible { outline: 3px solid var(--sky); }
.ask { display: flex; gap: 8px; padding: 10px 14px 14px; border-top: 2px solid #efe8da; }
.ask input { flex: 1; min-width: 0; font: inherit; font-size: 15.5px; font-weight: 600; padding: 8px 12px; border-radius: 11px; border: 2px solid #d9d2c3; color: var(--ink); background: #fff; }
.ask input:focus { outline: none; border-color: var(--lime-dk); }
.note { font-size: 12px; color: var(--muted); padding: 0 14px 12px; font-weight: 600; }

.done { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); width: min(460px, calc(100% - 32px)); padding: 22px; text-align: center; display: flex; flex-direction: column; gap: 10px; }
.done h3 { font-family: var(--f-display); font-weight: 800; font-size: 28px; margin: 0; color: var(--navy); line-height: 1.1; }
.done p { margin: 0; color: var(--muted); }
.done .row { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin-top: 4px; }

.fade { position: absolute; inset: 0; background: #070b18; opacity: 0; pointer-events: none; transition: opacity .6s ease; }
.fade.on { opacity: 1; }
.fade.white { background: #f4fff0; }
.loading { position: absolute; inset: 0; display: grid; place-items: center; font-family: var(--f-display); font-size: 20px; color: var(--cream); }

/* ---------- Puzzle + kid speaker ---------- */
.dialog .avatar.kid { background: radial-gradient(circle at 50% 64%, #f2c39b 0 45%, #7a4a2a 46%); }
.dialog .avatar.kid::before, .dialog .avatar.kid::after { top: 32px; width: 8px; height: 10px; transform: none; }
.pz { position: relative; margin: 0 auto; flex-shrink: 0; background: #0b1330; border-radius: 14px; overflow: hidden; touch-action: none; transition: height .7s ease; max-width: 100%; }
.pz-inner { position: absolute; left: 0; top: 0; width: 100%; transition: transform 1.6s cubic-bezier(.4,0,.2,1); }
.pz-board { position: absolute; left: 0; top: 0; width: 100%; background-color: #101c40; background-image: linear-gradient(rgba(143,208,239,.3) 2px, transparent 2px), linear-gradient(90deg, rgba(143,208,239,.3) 2px, transparent 2px); box-shadow: inset 0 0 0 2px rgba(143,208,239,.45); }
.pz-piece { position: absolute; background-repeat: no-repeat; border-radius: 7px; box-shadow: 0 0 0 2px #8fd0ef, 0 6px 14px rgba(0,0,0,.55); cursor: grab; touch-action: none; }
.pz-piece.drag { cursor: grabbing; z-index: 5; box-shadow: 0 0 0 3px #ffd27a, 0 14px 26px rgba(0,0,0,.65); }
.pz-piece.ok { box-shadow: none; border-radius: 0; cursor: default; }
.pz-piece.back { transition: left .3s, top .3s; }
.pz-dot { position: absolute; width: 10px; height: 10px; margin: -5px 0 0 -5px; border-radius: 50%; background: #ff5a3c; box-shadow: 0 0 0 2px #fff, 0 0 16px 6px rgba(255,120,60,.9); animation: ping 1s ease-in-out infinite; z-index: 6; }
@keyframes ping { 50% { transform: scale(1.6); } }
.pz-label { font-family: var(--f-display); font-weight: 800; font-size: 21px; color: var(--navy); line-height: 1.25; }
/* ---------- Level 1 ---------- */
.help-btn { z-index: 5; } .chat { z-index: 6; }
.dialog .avatar.lina { background: radial-gradient(circle at 50% 38%, #e3a77c, #9a5b36); }
.dialog .avatar.lina::before, .dialog .avatar.lina::after { top: 26px; width: 9px; height: 11px; }
.meters { position: absolute; top: 86px; inset-inline-start: 12px; width: 214px; padding: 10px 12px; display: flex; flex-direction: column; gap: 6px; pointer-events: none; }
.meter { display: grid; grid-template-columns: 22px 1fr 30px; gap: 6px; align-items: center; font-size: 13px; font-weight: 800; color: var(--ink); }
.meter .ic { font-size: 16px; line-height: 1; }
.meter .bar { height: 10px; background: #ece4d4; border-radius: 6px; overflow: hidden; }
.meter .fill { height: 100%; border-radius: 6px; background: var(--c); transition: width .4s; }
.meter .n { text-align: end; font-variant-numeric: tabular-nums; color: var(--muted); font-size: 12px; }
.meter.low .fill { animation: blink .8s infinite; }
@keyframes blink { 50% { opacity: .35; } }
.meters .sci { display: flex; justify-content: space-between; font-weight: 800; font-size: 13.5px; border-top: 2px dashed #ece4d4; padding-top: 6px; color: var(--navy); }
.inv { position: absolute; left: 50%; bottom: 14px; transform: translateX(-50%); display: flex; gap: 8px; padding: 8px; border-radius: 18px; background: rgba(16,26,51,.55); }
.slot { all: unset; cursor: pointer; position: relative; width: 52px; height: 52px; border-radius: 13px; background: var(--paper); display: grid; place-items: center; font-size: 27px; box-shadow: 0 4px 0 rgba(0,0,0,.22); }
.slot:focus-visible { outline: 3px solid var(--sky); }
.slot .k { position: absolute; top: 1px; inset-inline-start: 5px; font-size: 11px; font-weight: 800; color: var(--muted); }
.slot .u { position: absolute; bottom: -5px; inset-inline-end: -5px; min-width: 20px; height: 20px; padding: 0 5px; border-radius: 10px; background: var(--orange); color: #fff; font-size: 12px; font-weight: 800; display: grid; place-items: center; }
.slot.passive .u { background: var(--lime-dk); }
.slot.used-up { opacity: .45; }
.lv1 .prompt { bottom: 90px; } .lv1 .caption { bottom: 150px; } .lv1 .hint-keys { display: none; } .lv1 .help-btn { bottom: 90px; } .lv1 .stick { bottom: 90px; }
#lvOverlay { padding-bottom: 76px; }
.lv1:has(#lvOverlay:not([hidden])) .help-btn { bottom: 14px; }
.lvp { width: min(640px, 100%); max-height: 100%; overflow-y: auto; padding: 22px 22px 20px; display: flex; flex-direction: column; gap: 14px; animation: pop2 .25s ease-out; }
.lvp .eyebrow { font-weight: 800; letter-spacing: .12em; text-transform: uppercase; font-size: 12.5px; color: var(--orange-dk); }
.lvp h2 { font-family: var(--f-display); font-weight: 800; font-size: 28px; line-height: 1.1; margin: 0; color: var(--navy); text-wrap: balance; }
.lvp p { margin: 0; color: var(--ink); font-size: 16px; }
.lvp .actions { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; justify-content: space-between; }
.facts { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 10px; }
.fact { background: #fff; border: 2px solid #efe1c4; border-radius: 14px; padding: 10px 12px; display: flex; flex-direction: column; gap: 3px; }
.fact .ic { font-size: 26px; line-height: 1.1; }
.fact b { font-family: var(--f-display); color: var(--navy); font-size: 16.5px; line-height: 1.2; }
.fact span { font-size: 14.5px; color: var(--ink); }
.science { background: #eef7fd; border: 2px solid #cfe7f5; border-radius: 14px; padding: 12px 14px; display: flex; flex-direction: column; gap: 4px; }
.science .k { font-weight: 800; font-size: 12px; letter-spacing: .1em; text-transform: uppercase; color: #2a6f98; }
.science p { font-size: 15px; }
.src { font-size: 12px; color: var(--muted); font-weight: 700; }
.items { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.item { all: unset; box-sizing: border-box; cursor: pointer; background: #fff; border: 3px solid #e8dfcd; border-radius: 14px; padding: 8px 6px; text-align: center; display: flex; flex-direction: column; align-items: center; gap: 2px; }
.item .ic { font-size: 32px; line-height: 1.2; }
.item b { font-size: 14px; color: var(--navy); line-height: 1.2; }
.item[aria-pressed="true"] { border-color: var(--lime-dk); background: #f1f9e0; box-shadow: 0 0 0 3px rgba(156,204,60,.35); }
.item:focus-visible { outline: 3px solid var(--sky); }
.count { font-weight: 800; color: var(--navy); font-size: 16px; }
.opts { display: flex; flex-direction: column; gap: 8px; }
.opt { all: unset; box-sizing: border-box; cursor: pointer; background: #fff; border: 3px solid #e8dfcd; border-radius: 14px; padding: 10px 14px; font-weight: 700; color: var(--ink); font-size: 15.5px; }
.opt:hover { border-color: var(--orange); }
.opt.right { border-color: var(--lime-dk); background: #f1f9e0; }
.opt.wrong { border-color: var(--red); background: #fdecea; }
.opt[disabled] { opacity: .45; pointer-events: none; }
.opt:focus-visible { outline: 3px solid var(--sky); }
.opt small { display: block; font-weight: 700; color: var(--muted); font-size: 13px; }
.feedback { border-radius: 14px; padding: 10px 14px; font-weight: 700; font-size: 15px; }
.feedback.good { background: #eaf6d2; color: #2f4a0a; } .feedback.try { background: #fff1dc; color: #6a3a0a; }
.samples { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.sample { background: #fff; border: 2px solid #efe1c4; border-radius: 14px; padding: 10px; display: flex; flex-direction: column; gap: 6px; text-align: center; }
.sample .ic { font-size: 26px; }
.sample b { color: var(--navy); font-family: var(--f-display); font-size: 15px; line-height: 1.2; }
.mini { font-size: 12px; font-weight: 800; color: var(--muted); text-align: start; }
.mbar { height: 10px; border-radius: 6px; background: #ece4d4; overflow: hidden; }
.mbar i { display: block; height: 100%; background: var(--sky); border-radius: 6px; width: 0; transition: width 1.4s ease-out; }
.mbar.life i { background: var(--lime); }
.sort { display: flex; flex-direction: column; gap: 8px; }
.srow { background: #fff; border: 2px solid #efe1c4; border-radius: 14px; padding: 9px 11px; display: flex; flex-direction: column; gap: 6px; }
.srow .st { font-weight: 700; font-size: 15px; color: var(--ink); }
.srow .bs { display: flex; gap: 6px; flex-wrap: wrap; }
.sb { all: unset; cursor: pointer; padding: 3px 12px; border-radius: 999px; border: 2px solid #d9d2c3; font-weight: 800; font-size: 13.5px; color: var(--navy); }
.sb[aria-pressed="true"] { background: var(--navy); color: #fff; border-color: var(--navy); }
.sb:focus-visible { outline: 3px solid var(--sky); }
.srow.ok { border-color: var(--lime-dk); background: #f6fbea; } .srow.no { border-color: var(--red); }
.srow .why { font-size: 13.5px; color: var(--muted); font-weight: 600; }
.badges { display: grid; grid-template-columns: repeat(auto-fill, minmax(118px, 1fr)); gap: 8px; }
.badge { background: #fff; border: 2px solid #efe1c4; border-radius: 14px; padding: 8px; text-align: center; font-weight: 800; font-size: 13.5px; color: var(--navy); }
.badge .ic { font-size: 28px; display: block; }
.badge.off { opacity: .35; filter: grayscale(1); }
.notebook { display: flex; flex-direction: column; gap: 6px; margin: 0; padding-inline-start: 20px; color: var(--ink); }
.notebook li { font-size: 14.5px; }
.lvp h3 { font-family: var(--f-display); font-size: 18px; margin: 4px 0 0; color: var(--navy); }
.scope { position: absolute; inset: 0; background: #02040c; display: grid; place-items: center; z-index: 4; }
.scope canvas { width: min(74vmin, 540px); height: min(74vmin, 540px); max-width: 100%; border-radius: 50%; box-shadow: 0 0 0 10px #1a2440, 0 0 60px rgba(0,0,0,.8); cursor: grab; touch-action: none; }
.scope .tip { position: absolute; top: 14px; left: 50%; transform: translateX(-50%); width: min(520px, calc(100% - 28px)); padding: 10px 14px; text-align: center; font-weight: 700; color: var(--ink); }
.scope .close { position: absolute; bottom: 16px; left: 50%; transform: translateX(-50%); }
@media (max-width: 640px) {
  .items { grid-template-columns: repeat(2, 1fr); }
  .samples { grid-template-columns: 1fr; }
  .meters { width: 168px; top: auto; bottom: 150px; }
  .slot { width: 44px; height: 44px; font-size: 22px; }
}
@media (max-width: 640px) {
  .objective .t { font-size: 15px; }
  .title-card h1 { font-size: 32px; }
  .invite { padding: 24px 18px 20px; }
  .invite h2 { font-size: 28px; }
  .invite .body { font-size: 15.5px; }
  .dialog .line { font-size: 16px; }
  .chat { top: auto; height: 62%; }
  .caption { font-size: 17px; bottom: 150px; }
  .prompt { bottom: 150px; }
}
@media (prefers-reduced-motion: reduce) { .invite, .dialog, .chat, .marker .pin { animation: none; } }

/* ---------- Fun layer: stars, confetti, reactions ---------- */
.winbox { display: flex; flex-direction: column; gap: 10px; align-items: stretch; }
.stars { display: flex; justify-content: center; gap: 10px; font-size: 46px; line-height: 1; }
.stars span { color: #e2dccd; transform: scale(0); animation: starIn .45s cubic-bezier(.3,1.8,.5,1) forwards; }
.stars span.on { color: #ffc22e; text-shadow: 0 3px 0 #c98a00; }
@keyframes starIn { to { transform: scale(1); } }
.fact1 { background: #fff8e2; border-radius: 12px; padding: 8px 12px; font-weight: 700; color: #6a4a0a; font-size: 14.5px; text-align: center; }
.cf { position: absolute; top: -14px; width: 10px; height: 14px; border-radius: 2px; z-index: 60; pointer-events: none; animation: cfall 1.7s ease-in forwards; }
@keyframes cfall { to { top: 105%; transform: translateX(40px) rotate(720deg); opacity: .6; } }
.tip1 { font-weight: 800 !important; color: var(--navy) !important; font-size: 17px !important; text-align: center; }
.robot-box.awake svg { animation: dance .45s ease-in-out 4; }
.robot-box.spark { animation: shk .3s 3; }
@keyframes dance { 25% { transform: translateY(-10px) rotate(-6deg); } 75% { transform: translateY(-10px) rotate(6deg); } }
.flask .cube.newc { animation: popIn .3s cubic-bezier(.3,1.8,.5,1); }
@keyframes popIn { from { transform: scale(0) translateY(-30px); } to { transform: none; } }
.bottles.win .btl.ok { animation: hop .5s ease 2; }
@keyframes hop { 50% { transform: translateY(-10px); } }
.feel { font-size: 58px; text-align: center; line-height: 1; transition: transform .2s; }
.feel.bump { animation: bump .3s; } @keyframes bump { 50% { transform: scale(1.3); } }
.dummy.win { animation: dance .45s ease-in-out 3; }
/* ---------- Hands-on rooms ---------- */
.stoast { position: absolute; left: 50%; top: 42%; z-index: 30; pointer-events: none; animation: stIn 1.9s ease forwards; }
.stoast .stamp { width: 150px; height: 150px; border: 6px double var(--c); background: #fff; color: var(--navy); transform: rotate(-8deg); }
.stoast .stamp .ic { opacity: 1; filter: none; font-size: 54px; }
.stoast .stamp b { font-size: 15px; }
@keyframes stIn { 0% { transform: translate(-50%, -50%) scale(2.6); opacity: 0; } 18% { transform: translate(-50%, -50%) scale(1); opacity: 1; } 80% { opacity: 1; } 100% { transform: translate(-50%, -50%) scale(1); opacity: 0; } }
.stamp .ic.sn { font-family: var(--f-display); font-weight: 800; color: var(--c); }
.face2 { width: 64px; height: 64px; border-radius: 50%; margin: 0 auto; position: relative; transition: background .3s; }
.face2.ok { background: #9ccc3c; } .face2.hot { background: #ec5a50; } .face2.cold { background: #5a9be0; }
.face2 i { position: absolute; top: 22px; width: 9px; height: 11px; border-radius: 50%; background: #1b1530; } .face2 i:first-child { left: 18px; } .face2 i:nth-child(2) { right: 18px; }
.face2 b { position: absolute; left: 20px; right: 20px; top: 40px; height: 10px; border: 4px solid #1b1530; border-top: 0; border-radius: 0 0 20px 20px; }
.face2.hot b, .face2.cold b { border: 0; border-top: 4px solid #1b1530; height: 0; top: 44px; border-radius: 0; }
/* ---------- Level 1 stations ---------- */
.air-wrap { display: grid; grid-template-columns: 1fr 90px 1fr; gap: 12px; align-items: center; }
.robot-box { background: #0f1838; border-radius: 14px; padding: 8px; } .robot { width: 100%; max-height: 170px; }
.flask { display: flex; flex-direction: column-reverse; gap: 4px; padding: 8px; border: 4px solid #9aa6bd; border-top-width: 0; border-radius: 0 0 22px 22px; background: rgba(143,208,239,.15); }
.cube { all: unset; box-sizing: border-box; cursor: pointer; height: 34px; border-radius: 8px; display: grid; place-items: center; font-weight: 800; color: #fff; font-size: 15px; }
.cube.o2 { background: #3a8fd8; } .cube.n2 { background: #7a8296; } .cube.emptyc { border: 2px dashed #c9d0de; cursor: default; }
.cube.big { height: 70px; font-size: 22px; flex-direction: column; display: flex; justify-content: center; align-items: center; box-shadow: 0 5px 0 rgba(0,0,0,.2); }
.cube.big small { font-size: 12px; font-weight: 700; }
.cube-src { display: flex; flex-direction: column; gap: 10px; }
.cube:focus-visible { outline: 3px solid var(--sky); }
.bottles { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.btl { background: #fff; border: 3px solid #efe1c4; border-radius: 14px; padding: 8px; display: flex; flex-direction: column; align-items: center; gap: 6px; text-align: center; }
.btl svg { width: 46px; height: 80px; } .btl b { color: var(--navy); font-size: 14.5px; }
.btl .bs { display: flex; flex-direction: column; gap: 5px; width: 100%; } .btl .sb { text-align: center; }
.btl.ok { border-color: var(--lime-dk); } .btl.no { border-color: var(--red); } .btl .why { color: #9a2a20; font-weight: 700; font-size: 12.5px; }

// ============================== Sound ==============================
const SFX = (() => {
  let ac = null, master = null, muted = false, windG = null, beamG = null, amb = 'bedroom', nbuf = null, mi = 2;
  const SC = { bedroom: [523.25, 587.33, 659.25, 783.99, 880, 1046.5], yard: [392, 440, 523.25, 587.33, 659.25, 783.99], flight: [440, 523.25, 587.33, 659.25, 783.99, 880], desert: [329.63, 392, 440, 493.88, 587.33, 659.25] };
  const WIND = { bedroom: 0, yard: 0.025, flight: 0.11, desert: 0.035, academy: 0 };

    setInterval(() => { if (!ac || muted || ac.state !== 'running' || document.hidden || mus) return; if (Math.random() < 0.4) { const sc = SC[amb] || SC.desert; mi = Math.max(0, Math.min(sc.length - 1, mi + [-2, -1, -1, 0, 1, 1, 2][(Math.random() * 7) | 0])); tone(sc[mi], 1.6, 'sine', 0.022); if (Math.random() < 0.25) tone(sc[mi] / 2, 2, 'triangle', 0.025); } }, 560);
  }
  function tone(f, d = 0.15, type = 'sine', v = 0.2, when = 0, slide = 0) {

    o.connect(g); g.connect(master); o.start(t0); o.stop(t0 + d + 0.03);
  }
  function noise(d, f0, f1, v = 0.2, when = 0, q = 1, type = 'bandpass') {

    src.buffer = noiseBuf(); src.loop = true; fl.type = type; fl.Q.value = q; fl.frequency.setValueAtTime(f0, t0); fl.frequency.exponentialRampToValueAtTime(f1, t0 + d);
    g.gain.setValueAtTime(0.0001, t0); g.gain.exponentialRampToValueAtTime(v, t0 + d * 0.3); g.gain.exponentialRampToValueAtTime(0.0001, t0 + d);

  const mf = (m) => 440 * Math.pow(2, (m - 69) / 12);
  // original bouncy major-key songs (bright and happy, like popular kid games), marimba + bass + claps
  const MEL = [[72, 1], [76, 1], [79, 1], [76, 1], [81, 1], [79, 1], [76, 1], [72, 1], [74, 1], [77, 1], [81, 1], [77, 1], [79, 3], [0, 1],
    [76, 1], [79, 1], [84, 1], [79, 1], [81, 1], [79, 1], [76, 1], [74, 1], [72, 1], [74, 1], [76, 1], [79, 1], [84, 3], [0, 1]];
  const BASS = [[48, 2], [55, 2], [48, 2], [55, 2], [50, 2], [57, 2], [43, 2], [50, 2], [48, 2], [55, 2], [53, 2], [57, 2], [48, 2], [55, 2], [48, 4]];
  const DRUM = [[1, 2], [2, 2], [1, 1], [1, 1], [2, 2]];
  const SPARK = [[0, 3], [96, 1], [0, 3], [91, 1], [0, 3], [93, 1], [0, 3], [91, 1]];
  const up = (arr, n) => arr.map(([a, b]) => [a ? a + n : 0, b]);
  const SONGS = {

  };
  SONGS.party = { step: 0.12, tracks: SONGS.march.tracks };

  SONGS.soft = { step: 0.5, tracks: [
    { inst: 'pad', v: 0.035, notes: [[48, 8], [45, 8], [41, 8], [43, 8]] },
    { inst: 'pad', v: 0.03, notes: [[55, 8], [52, 8], [48, 8], [50, 8]] },
    { inst: 'pad', v: 0.026, notes: [[64, 8], [60, 8], [57, 8], [59, 8]] },

  function mallet(f, t0, d, v) {

  }
  function bass(f, t0, d, v) {

    const end = t0 + Math.max(0.15, d * 0.9);

  }
  function drum(k, t0, v) {
    if (k === 1) { const o = ac.createOscillator(), g = ac.createGain(); o.frequency.setValueAtTime(140, t0); o.frequency.exponentialRampToValueAtTime(45, t0 + 0.12); g.gain.setValueAtTime(v * 2, t0); g.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.16); o.connect(g); g.connect(musG); o.start(t0); o.stop(t0 + 0.2); }
    else { const s = ac.createBufferSource(), fl = ac.createBiquadFilter(), g = ac.createGain(); s.buffer = noiseBuf(); fl.type = 'highpass'; fl.frequency.value = 6000; g.gain.setValueAtTime(v, t0); g.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.05); s.connect(fl); fl.connect(g); g.connect(musG); s.start(t0, Math.random()); s.stop(t0 + 0.06); }
  }
  function pad(f, t0, d, v) {
    const o = ac.createOscillator(), o2 = ac.createOscillator(), g = ac.createGain(), lp = ac.createBiquadFilter(); o.type = 'sine'; o2.type = 'triangle'; o.frequency.value = f; o2.frequency.value = f * 1.004; lp.type = 'lowpass'; lp.frequency.value = 760;
    const end = t0 + d + 1.6; g.gain.setValueAtTime(0.0001, t0); g.gain.linearRampToValueAtTime(v, t0 + 1.4); g.gain.setValueAtTime(v, t0 + d - 0.1); g.gain.linearRampToValueAtTime(0.0001, end);
    o.connect(lp); o2.connect(lp); lp.connect(g); g.connect(musG); o.start(t0); o2.start(t0); o.stop(end + 0.05); o2.stop(end + 0.05);

  function tick() {
    if (!mus || !ac || ac.state !== 'running') return;
    const S = SONGS[mus.name], horizon = ac.currentTime + 0.35;
    S.tracks.forEach((tk, j) => {
      const p = mus.ptr[j];
      while (p.t < horizon) {

const stage = $('stage');

const scene = new T.Scene();

Object.assign(sun.shadow.camera, { left: -18, right: 18, top: 18, bottom: -18, near: 1, far: 120 }); sun.shadow.bias = -0.0005;
scene.add(sun, sun.target);

// gradient sky dome
const skyMat = new T.ShaderMaterial({
  side: T.BackSide, depthWrite: false, fog: false,
  uniforms: { top: { value: new T.Color('#0b1430') }, bottom: { value: new T.Color('#22305c') }, sunDir: { value: new T.Vector3(0, 0.3, -1).normalize() }, sunCol: { value: new T.Color('#ffd9a0') }, sunAmt: { value: 0 } },
  vertexShader: 'varying vec3 vP; void main(){ vP = normalize(position); gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }',
  fragmentShader: 'uniform vec3 top; uniform vec3 bottom; uniform vec3 sunDir; uniform vec3 sunCol; uniform float sunAmt; varying vec3 vP; void main(){ float h = clamp(vP.y*1.4+0.12,0.0,1.0); vec3 c = mix(bottom, top, pow(h,0.75)); float s = max(dot(vP, normalize(sunDir)),0.0); c += sunCol * (pow(s,90.0)*1.2 + pow(s,6.0)*0.25) * sunAmt; gl_FragColor = vec4(c,1.0); }',
});
const sky = new T.Mesh(new T.SphereGeometry(400, 32, 16), skyMat); scene.add(sky);
const starGeo = new T.BufferGeometry(); const sp = [];
for (let i = 0; i < 1400; i++) { const th = Math.random() * Math.PI * 2, ph = Math.acos(Math.random() * 0.98); sp.push(Math.sin(ph) * Math.cos(th) * 360, Math.cos(ph) * 360, Math.sin(ph) * Math.sin(th) * 360); }

const starMat = new T.PointsMaterial({ color: 0xffffff, size: 1.8, sizeAttenuation: false, transparent: true, opacity: 0, fog: false, depthWrite: false });
const stars = new T.Points(starGeo, starMat); scene.add(stars);
const moon = new T.Mesh(new T.SphereGeometry(9, 20, 14), new T.MeshBasicMaterial({ color: 0xfff6d8, fog: false })); moon.position.set(-120, 150, -260); scene.add(moon);

// helpers

const STD = T['MeshStandard' + 'Material'];

const mat = (c, o = {}) => new STD(Object.assign({ color: c, roughness: 0.6, metalness: 0 }, o));

// Nuri floats beside the explorer on the camera's right, so it stays in view.

function updateNuriFollow(dt) {

  nuriTarget.copy(P.pos).addScaledVector(right, 0.72).add(new T.Vector3(0, 1.45, 0)).addScaledVector(fwd, moving ? -0.25 : 0.15);
  nuri.position.lerp(nuriTarget, Math.min(1, dt * (moving ? 5 : 3.5)));

  const camAng = Math.atan2(camera.position.x - nuri.position.x, camera.position.z - nuri.position.z);

// a crew capsule (used in space and for the Mars landing)
function makeCapsule() {

  const body = mesh(new T.CylinderGeometry(0.55, 1.25, 1.5, 28), mat(0xe9edf2, { roughness: 0.4 }), 0, 0.95, 0, g);
  mesh(new T.CylinderGeometry(1.3, 1.3, 0.22, 28), mat(0x6a4a3a, { roughness: 0.8 }), 0, 0.12, 0, g); // heat shield
  mesh(new T.CylinderGeometry(0.42, 0.55, 0.3, 20), mat(0xd9dee6), 0, 1.85, 0, g);
  const win = mesh(new T.CircleGeometry(0.2, 18), toonM({ color: 0x7fc8ff, emissive: 0x4fa8ff, emissiveIntensity: 0.6 }), 0, 1.15, 0.92, g, false); win.rotation.x = -0.45;

  mesh(new T.TorusGeometry(0.9, 0.05, 8, 28), mat(0xec8a3c), 0, 0.6, 0, g).rotation.x = Math.PI / 2;
  const glow = mesh(new T.SphereGeometry(1.7, 20, 14, 0, Math.PI * 2, Math.PI / 2, Math.PI / 2), new T.MeshBasicMaterial({ color: 0xff6a1a, transparent: true, opacity: 0, depthWrite: false }), 0, 0.2, 0, g, false);

  const chuteTex = canvasTex(256, 64, (c, w, h) => { for (let i = 0; i < 8; i++) { c.fillStyle = i % 2 ? '#ffffff' : '#ec8a3c'; c.fillRect(i * w / 8, 0, w / 8, h); } });

  mesh(new T.SphereGeometry(2.6, 24, 10, 0, Math.PI * 2, 0, Math.PI / 2.4), new T.MeshStandardMaterial({ map: chuteTex, side: T.DoubleSide, roughness: 0.8 }), 0, 6.2, 0, chute);

}
