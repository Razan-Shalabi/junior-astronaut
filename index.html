<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>html{color-scheme:light}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style></head><body>
<meta charset="utf-8">
<title>Junior Astronaut</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@500;600;700;800&family=Nunito:wght@500;600;700;800&display=swap">
<style>
/* Layout: a one-screen 3D game. The viewport fills the stage; rounded toy-like cards float over it for objectives, dialogue and the invitation. */
:root {
  color-scheme: dark;
  --deep: #101a33;
  --navy: #1f3a68;
  --cream: #f6f1e8;
  --paper: #fffaf0;
  --ink: #1d2742;
  --muted: #5d6680;
  --orange: #ec8a3c;
  --orange-dk: #b9611f;
  --red: #d8433a;
  --lime: #9ccc3c;
  --lime-dk: #6a9a1f;
  --sky: #8fd0ef;
  --gold: #c9a24a;
  --f-display: "Baloo Bhaijaan 2", "Nunito", system-ui, sans-serif;
  --f-body: "Nunito", "Baloo Bhaijaan 2", system-ui, sans-serif;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body {
  margin: 0; background: var(--deep); color: var(--cream); font-family: var(--f-body); font-size: 16px; line-height: 1.5;
  display: flex; flex-direction: column; overflow: hidden;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 12px;
}
.stage { position: relative; flex: 1; min-height: 0; border-radius: 18px; overflow: hidden; background: #000; touch-action: none; user-select: none; -webkit-user-select: none; box-shadow: 0 0 0 1px rgba(255,255,255,.08); }
.stage > canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; cursor: grab; }
.stage > canvas:active { cursor: grabbing; }
[dir="rtl"] .rtl-flip { direction: rtl; }

/* Generic toy card + buttons */
.card { background: var(--paper); color: var(--ink); border-radius: 18px; box-shadow: 0 8px 0 rgba(0,0,0,.18), 0 18px 40px rgba(0,0,0,.35); }
.btn { all: unset; box-sizing: border-box; cursor: pointer; font-family: var(--f-display); font-weight: 700; font-size: 18px; color: #fff; background: var(--orange); padding: 10px 22px 8px; border-radius: 14px; box-shadow: 0 5px 0 var(--orange-dk); transition: transform .08s, box-shadow .08s, filter .15s; text-align: center; line-height: 1.3; }
.btn:hover { filter: brightness(1.06); }
.btn:active { transform: translateY(3px); box-shadow: 0 2px 0 var(--orange-dk); }
.btn:focus-visible { outline: 3px solid var(--sky); outline-offset: 3px; }
.btn.green { background: var(--lime); box-shadow: 0 5px 0 var(--lime-dk); color: #1f2a08; }
.btn.ghost { background: rgba(255,255,255,.9); color: var(--ink); box-shadow: 0 5px 0 rgba(0,0,0,.2); }
.btn.small { font-size: 15px; padding: 7px 14px 5px; border-radius: 11px; }
.btn[disabled] { opacity: .5; pointer-events: none; }

/* HUD */
.topbar { position: absolute; top: 12px; left: 12px; right: 12px; display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; pointer-events: none; }
.objective { pointer-events: none; padding: 9px 16px 8px; max-width: min(420px, 70%); display: flex; gap: 10px; align-items: center; }
.objective .dot { width: 30px; height: 30px; flex: none; border-radius: 50%; background: var(--orange); display: grid; place-items: center; color: #fff; font-weight: 800; font-family: var(--f-display); }
.objective .k { font-size: 12px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: var(--orange-dk); line-height: 1.2; }
.objective .t { font-family: var(--f-display); font-weight: 700; font-size: 17px; line-height: 1.25; text-wrap: balance; }
.tools { display: flex; gap: 8px; pointer-events: auto; margin-inline-start: auto; }
.icon-btn { all: unset; cursor: pointer; min-width: 44px; height: 44px; padding: 0 12px; border-radius: 14px; background: rgba(255,250,240,.92); color: var(--ink); font-family: var(--f-display); font-weight: 700; font-size: 15px; display: grid; place-items: center; box-shadow: 0 4px 0 rgba(0,0,0,.2); }
.icon-btn:focus-visible { outline: 3px solid var(--sky); }
.icon-btn[aria-pressed="true"] { background: var(--lime); }
.marker { position: absolute; transform: translate(-50%, -100%); pointer-events: none; display: flex; flex-direction: column; align-items: center; }
.marker .pin { width: 26px; height: 26px; border-radius: 50% 50% 50% 0; transform: rotate(-45deg); background: var(--orange); border: 3px solid #fff; box-shadow: 0 3px 10px rgba(0,0,0,.35); animation: hop 1s ease-in-out infinite; }
@keyframes hop { 50% { translate: 0 -5px; } }
.prompt { position: absolute; left: 50%; bottom: 22px; transform: translateX(-50%); display: flex; align-items: center; gap: 10px; white-space: nowrap; }
.prompt kbd { font-family: var(--f-body); background: rgba(0,0,0,.18); border-radius: 7px; padding: 0 8px; font-size: 15px; }
.help-btn { position: absolute; right: 14px; bottom: 18px; display: flex; align-items: center; gap: 8px; }
.help-btn .face { width: 26px; height: 26px; border-radius: 50%; background: #c6ec6f; position: relative; }
.help-btn .face::before, .help-btn .face::after { content: ""; position: absolute; top: 8px; width: 7px; height: 9px; border-radius: 50%; background: #1b1530; }
.help-btn .face::before { left: 5px; } .help-btn .face::after { right: 5px; }
.skip { position: absolute; right: 14px; bottom: 18px; }
.hint-keys { position: absolute; left: 14px; bottom: 16px; font-size: 13px; font-weight: 700; background: rgba(16,26,51,.6); padding: 5px 11px; border-radius: 10px; pointer-events: none; }
.stick { position: absolute; left: 20px; bottom: 20px; width: 120px; height: 120px; border-radius: 50%; background: rgba(255,250,240,.18); border: 3px solid rgba(255,250,240,.5); touch-action: none; }
.stick .nub { position: absolute; left: 50%; top: 50%; width: 50px; height: 50px; margin: -25px 0 0 -25px; border-radius: 50%; background: rgba(255,250,240,.85); }

/* Caption + dialogue */
.caption { position: absolute; left: 50%; bottom: 84px; transform: translateX(-50%); max-width: min(640px, calc(100% - 32px)); text-align: center; font-family: var(--f-display); font-weight: 700; font-size: 20px; background: rgba(16,26,51,.72); padding: 8px 18px 6px; border-radius: 14px; text-wrap: balance; transition: opacity .35s; }
.dialog { position: absolute; left: 50%; bottom: 16px; transform: translateX(-50%); width: min(680px, calc(100% - 24px)); padding: 16px 18px 14px; display: grid; grid-template-columns: 64px 1fr; gap: 4px 14px; animation: pop .3s cubic-bezier(.2,1.4,.4,1); }
@keyframes pop { from { opacity: 0; transform: translate(-50%, 14px) scale(.96); } to { opacity: 1; transform: translateX(-50%); } }
.dialog .avatar { grid-row: 1 / 3; width: 64px; height: 64px; border-radius: 50%; background: radial-gradient(circle at 50% 40%, #c6ec6f, #8cc232); position: relative; box-shadow: inset 0 -4px 0 rgba(0,0,0,.12); }
.dialog .avatar::before, .dialog .avatar::after { content: ""; position: absolute; top: 20px; width: 15px; height: 21px; border-radius: 50%; background: #1b1530; box-shadow: inset -3px -3px 0 0 #1b1530, inset 3px 3px 0 0 rgba(255,255,255,.0); }
.dialog .avatar::before { left: 13px; transform: rotate(-12deg); } .dialog .avatar::after { right: 13px; transform: rotate(12deg); }
.dialog .avatar.narrator { background: radial-gradient(circle at 50% 40%, #ffd49a, var(--orange)); }
.dialog .avatar.narrator::before, .dialog .avatar.narrator::after { display: none; }
.dialog .who { font-family: var(--f-display); font-weight: 800; color: var(--lime-dk); font-size: 15px; line-height: 1.2; }
.dialog .who.narrator { color: var(--orange-dk); }
.dialog .line { font-size: 18px; font-weight: 600; min-height: 2.6em; }
.dialog .next { grid-column: 2; justify-self: end; margin-top: 4px; }
[dir="rtl"] .dialog .next { justify-self: start; }

/* Full-screen overlays */
.overlay { position: absolute; inset: 0; display: grid; place-items: center; padding: 16px; background: rgba(10,16,34,.55); backdrop-filter: blur(3px); overflow-y: auto; }
.title-card { width: min(520px, 100%); padding: 26px 26px 24px; display: flex; flex-direction: column; gap: 14px; text-align: center; }
.title-card h1 { font-family: var(--f-display); font-weight: 800; font-size: 40px; line-height: 1.05; margin: 0; color: var(--navy); text-wrap: balance; }
.title-card h1 span { color: var(--orange); }
.title-card .sub { font-family: var(--f-display); font-weight: 700; color: var(--red); font-size: 18px; margin-top: -6px; }
.title-card p { margin: 0; color: var(--muted); font-size: 15.5px; }
.field { display: flex; flex-direction: column; gap: 6px; text-align: start; }
.field label { font-weight: 800; font-size: 14px; color: var(--navy); }
.field input { font: inherit; font-size: 18px; font-weight: 700; padding: 10px 14px; border-radius: 12px; border: 2px solid #d9d2c3; background: #fff; color: var(--ink); }
.field input:focus { outline: none; border-color: var(--orange); }
.field small { color: var(--muted); font-size: 12.5px; }
.lang-row { display: flex; gap: 8px; justify-content: center; }
.seg { all: unset; cursor: pointer; padding: 6px 16px; border-radius: 10px; font-weight: 800; border: 2px solid #d9d2c3; color: var(--ink); font-family: var(--f-display); }
.seg[aria-pressed="true"] { background: var(--navy); border-color: var(--navy); color: #fff; }
.seg:focus-visible { outline: 3px solid var(--sky); }
.controls-mini { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px 14px; font-size: 13.5px; color: var(--muted); font-weight: 700; }
.controls-mini b { color: var(--ink); background: #efe8da; border-radius: 6px; padding: 0 6px; }

.invite-wrap { perspective: 1200px; }
.invite { width: min(560px, calc(100vw - 48px)); padding: 30px 30px 24px; display: flex; flex-direction: column; gap: 14px; position: relative; text-align: center; transform-origin: 50% 80%; animation: unfold .9s cubic-bezier(.2,1.2,.3,1) both; background:
  radial-gradient(circle at 12% 10%, rgba(236,138,60,.10), transparent 40%), radial-gradient(circle at 90% 92%, rgba(143,208,239,.18), transparent 45%), var(--paper); border: 3px solid #efe1c4; }
@keyframes unfold { from { opacity: 0; transform: rotateX(70deg) scale(.4) translateY(80px); } to { opacity: 1; transform: none; } }
.invite .patch { width: 104px; height: 104px; margin: -4px auto 0; filter: drop-shadow(0 4px 0 rgba(0,0,0,.12)); }
.invite .eyebrow { font-weight: 800; letter-spacing: .14em; text-transform: uppercase; font-size: 12.5px; color: var(--orange-dk); }
.invite h2 { font-family: var(--f-display); font-weight: 800; font-size: 34px; line-height: 1.05; margin: 0; color: var(--navy); }
.invite .body { font-size: 17px; color: var(--ink); max-width: 46ch; margin: 0 auto; display: flex; flex-direction: column; gap: 10px; }
.invite .body p { margin: 0; }
.invite .sig { font-family: var(--f-display); font-weight: 700; color: var(--navy); }
.invite .sig small { display: block; font-family: var(--f-body); color: var(--muted); font-weight: 600; font-size: 12.5px; }
.invite .stamp { position: absolute; top: 18px; inset-inline-end: 20px; transform: rotate(10deg); border: 3px solid var(--red); color: var(--red); font-family: var(--f-display); font-weight: 800; font-size: 13px; padding: 2px 9px 0; border-radius: 8px; letter-spacing: .06em; opacity: .85; }

.chat { position: absolute; top: 70px; bottom: 16px; inset-inline-end: 14px; width: min(380px, calc(100% - 28px)); display: flex; flex-direction: column; overflow: hidden; animation: pop2 .25s ease-out; }
@keyframes pop2 { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
.chat header { display: flex; align-items: center; gap: 10px; padding: 12px 14px; border-bottom: 2px solid #efe8da; }
.chat header .t { font-family: var(--f-display); font-weight: 800; font-size: 19px; flex: 1; color: var(--navy); line-height: 1.2; }
.chat header .t small { display: block; font-family: var(--f-body); font-size: 12px; color: var(--muted); font-weight: 700; }
.chat .log { flex: 1; overflow-y: auto; padding: 12px 14px; display: flex; flex-direction: column; gap: 9px; }
.bub { max-width: 88%; padding: 8px 12px; border-radius: 14px; font-size: 15.5px; font-weight: 600; line-height: 1.45; }
.bub.nuri { background: #eaf6d2; align-self: flex-start; border-end-start-radius: 4px; }
.bub.me { background: var(--navy); color: #fff; align-self: flex-end; border-end-end-radius: 4px; }
.bub.thinking { color: var(--muted); font-style: italic; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; padding: 0 14px 10px; }
.chip { all: unset; cursor: pointer; font-size: 13.5px; font-weight: 800; color: var(--navy); background: #fff; border: 2px solid #d9d2c3; padding: 4px 11px; border-radius: 999px; }
.chip:hover { border-color: var(--orange); }
.chip:focus-visible { outline: 3px solid var(--sky); }
.ask { display: flex; gap: 8px; padding: 10px 14px 14px; border-top: 2px solid #efe8da; }
.ask input { flex: 1; min-width: 0; font: inherit; font-size: 15.5px; font-weight: 600; padding: 8px 12px; border-radius: 11px; border: 2px solid #d9d2c3; color: var(--ink); background: #fff; }
.ask input:focus { outline: none; border-color: var(--lime-dk); }
.note { font-size: 12px; color: var(--muted); padding: 0 14px 12px; font-weight: 600; }

.done { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); width: min(460px, calc(100% - 32px)); padding: 22px; text-align: center; display: flex; flex-direction: column; gap: 10px; }
.done h3 { font-family: var(--f-display); font-weight: 800; font-size: 28px; margin: 0; color: var(--navy); line-height: 1.1; }
.done p { margin: 0; color: var(--muted); }
.done .row { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin-top: 4px; }

.fade { position: absolute; inset: 0; background: #070b18; opacity: 0; pointer-events: none; transition: opacity .6s ease; }
.fade.on { opacity: 1; }
.fade.white { background: #f4fff0; }
.loading { position: absolute; inset: 0; display: grid; place-items: center; font-family: var(--f-display); font-size: 20px; color: var(--cream); }

/* ---------- Puzzle + kid speaker ---------- */
.dialog .avatar.kid { background: radial-gradient(circle at 50% 64%, #f2c39b 0 45%, #7a4a2a 46%); }
.dialog .avatar.kid::before, .dialog .avatar.kid::after { top: 32px; width: 8px; height: 10px; transform: none; }
.pz { position: relative; margin: 0 auto; background: #0b1330; border-radius: 14px; overflow: hidden; touch-action: none; transition: height .7s ease; max-width: 100%; }
.pz-inner { position: absolute; left: 0; top: 0; width: 100%; transition: transform 1.6s cubic-bezier(.4,0,.2,1); }
.pz-board { position: absolute; left: 0; top: 0; width: 100%; background-color: #101c40; background-image: linear-gradient(rgba(143,208,239,.3) 2px, transparent 2px), linear-gradient(90deg, rgba(143,208,239,.3) 2px, transparent 2px); box-shadow: inset 0 0 0 2px rgba(143,208,239,.45); }
.pz-piece { position: absolute; background-repeat: no-repeat; border-radius: 7px; box-shadow: 0 0 0 2px #8fd0ef, 0 6px 14px rgba(0,0,0,.55); cursor: grab; touch-action: none; }
.pz-piece.drag { cursor: grabbing; z-index: 5; box-shadow: 0 0 0 3px #ffd27a, 0 14px 26px rgba(0,0,0,.65); }
.pz-piece.ok { box-shadow: none; border-radius: 0; cursor: default; }
.pz-piece.back { transition: left .3s, top .3s; }
.pz-dot { position: absolute; width: 10px; height: 10px; margin: -5px 0 0 -5px; border-radius: 50%; background: #ff5a3c; box-shadow: 0 0 0 2px #fff, 0 0 16px 6px rgba(255,120,60,.9); animation: ping 1s ease-in-out infinite; z-index: 6; }
@keyframes ping { 50% { transform: scale(1.6); } }
.pz-label { font-family: var(--f-display); font-weight: 800; font-size: 21px; color: var(--navy); line-height: 1.25; }
/* ---------- Level 1 stations ---------- */
.air-wrap { display: grid; grid-template-columns: 1fr 90px 1fr; gap: 12px; align-items: center; }
.robot-box { background: #0f1838; border-radius: 14px; padding: 8px; } .robot { width: 100%; max-height: 170px; }
.flask { display: flex; flex-direction: column-reverse; gap: 4px; padding: 8px; border: 4px solid #9aa6bd; border-top-width: 0; border-radius: 0 0 22px 22px; background: rgba(143,208,239,.15); }
.cube { all: unset; box-sizing: border-box; cursor: pointer; height: 34px; border-radius: 8px; display: grid; place-items: center; font-weight: 800; color: #fff; font-size: 15px; }
.cube.o2 { background: #3a8fd8; } .cube.n2 { background: #7a8296; } .cube.emptyc { border: 2px dashed #c9d0de; cursor: default; }
.cube.big { height: 70px; font-size: 22px; flex-direction: column; display: flex; justify-content: center; align-items: center; box-shadow: 0 5px 0 rgba(0,0,0,.2); }
.cube.big small { font-size: 12px; font-weight: 700; }
.cube-src { display: flex; flex-direction: column; gap: 10px; }
.cube:focus-visible { outline: 3px solid var(--sky); }
.bottles { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.btl { background: #fff; border: 3px solid #efe1c4; border-radius: 14px; padding: 8px; display: flex; flex-direction: column; align-items: center; gap: 6px; text-align: center; }
.btl svg { width: 46px; height: 80px; } .btl b { color: var(--navy); font-size: 14.5px; }
.btl .bs { display: flex; flex-direction: column; gap: 5px; width: 100%; } .btl .sb { text-align: center; }
.btl.ok { border-color: var(--lime-dk); } .btl.no { border-color: var(--red); } .btl .why { color: #9a2a20; font-weight: 700; font-size: 12.5px; }
.sky-day, .sky-night { border-radius: 14px; padding: 10px 14px; font-weight: 800; }
.sky-day { background: #fff1d6; color: #8a4a0a; } .sky-night { background: #1f2a5c; color: #dfe8ff; }
.thermo { position: relative; height: 70px; margin: 18px 6px 4px; }
.thermo::before { content: ""; position: absolute; left: 0; right: 0; top: 26px; height: 18px; border-radius: 10px; background: linear-gradient(90deg, #5a9be0, #8fd0ef 40%, #ffd27a 60%, #ec5a50); }
.tz { position: absolute; top: 20px; height: 30px; border: 4px solid #6a9a1f; border-radius: 8px; background: rgba(156,204,60,.35); }
.tarrow { position: absolute; top: 0; transform: translateX(-50%); transition: left .35s; display: flex; flex-direction: column; align-items: center; }
.tarrow span { background: var(--navy); color: #fff; font-weight: 800; font-size: 13px; padding: 1px 7px; border-radius: 8px; margin-top: -18px; }
.tarrow::after { content: "▼"; color: var(--navy); font-size: 16px; line-height: 1; }
.tl { position: absolute; left: 0; right: 0; top: 50px; display: flex; justify-content: space-between; font-size: 12px; font-weight: 700; color: var(--muted); }
.inds { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.ind { background: #eaf6d2; border: 3px solid var(--lime-dk); border-radius: 14px; padding: 10px; text-align: center; display: flex; flex-direction: column; align-items: center; gap: 2px; }
.ind span { font-size: 28px; } .ind b { color: var(--navy); } .ind i { font-style: normal; color: #3c6a10; font-weight: 800; }
@media (max-width: 640px) { .air-wrap { grid-template-columns: 1fr 80px; } .robot-box { grid-column: 1 / -1; } .bottles { grid-template-columns: 1fr; } }
/* ---------- Level 2: Training Academy ---------- */
.nline { display: flex; gap: 10px; align-items: center; background: #eef8dc; border-radius: 14px; padding: 8px 12px; font-weight: 700; color: #34480f; font-size: 15px; }
.nline .nface { flex: none; width: 30px; height: 30px; border-radius: 50%; background: radial-gradient(circle at 50% 40%, #c6ec6f, #8cc232); position: relative; }
.nline .nface::before, .nline .nface::after { content: ""; position: absolute; top: 9px; width: 7px; height: 10px; border-radius: 50%; background: #1b1530; }
.nline .nface::before { left: 7px; } .nline .nface::after { right: 7px; }
.mini-note { font-size: 13.5px !important; color: var(--muted) !important; font-weight: 600; }
.l2-success { display: flex; flex-direction: column; gap: 12px; }
.orr-wrap { display: flex; justify-content: center; }
.orr-wrap canvas { border-radius: 14px; max-width: 100%; cursor: pointer; touch-action: none; }
.orr-info { background: #0f1838; color: #e8eefc; border-radius: 12px; padding: 9px 13px; font-size: 14.5px; font-weight: 600; min-height: 2.6em; }
.suit-wrap { display: grid; grid-template-columns: 220px 1fr; gap: 14px; align-items: start; }
.dummy { position: relative; width: 220px; height: 300px; background: radial-gradient(circle at 50% 40%, #1d2a5c, #0b1330); border-radius: 16px; }
.dsvg { position: absolute; left: 10px; top: 0; width: 200px; height: 300px; }
.dslot { position: absolute; border: 3px dashed rgba(255,210,122,.85); border-radius: 12px; cursor: pointer; transition: transform .15s; }
.dslot.filled { border-color: transparent; }
.dslot.shake { animation: shk .35s; }
@keyframes shk { 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }
.s-helmet { left: 72px; top: 8px; width: 76px; height: 76px; border-radius: 50%; }
.s-gloves { left: 26px; top: 142px; width: 168px; height: 44px; }
.s-boots { left: 66px; top: 236px; width: 88px; height: 56px; }
.s-life { left: 150px; top: 72px; width: 62px; height: 70px; }
.worn { position: absolute; pointer-events: none; }
.worn svg { width: 100%; height: 100%; }
.w-helmet { left: 66px; top: 4px; width: 88px; height: 88px; } .w-gloves { left: 39px; top: 130px; width: 160px; height: 64px; } .w-gloves svg { width: 100%; }
.w-boots { left: 62px; top: 226px; width: 96px; height: 70px; } .w-life { left: 148px; top: 70px; width: 66px; height: 76px; }

  const d = Math.hypot(x, z);
  let h = Math.sin(x * 0.07 + Math.sin(z * 0.045) * 2.2) * 1.4 + (fbm(x * 0.03, z * 0.03) - 0.5) * 4 + (fbm(x * 0.15, z * 0.15) - 0.5) * 0.4;
  h *= smooth(9, 22, d);
  h += smooth(55, 120, d) * (14 + (fbm(x * 0.04 + 9, z * 0.04) - 0.5) * 26);
  const hd2 = (x - 4) * (x - 4) + (z + 36) * (z + 36); h += 7.5 * Math.exp(-hd2 / 150);
  return h;
}

  // ---------- Task 4: Systems check ----------
  const T4 = {

    const ICON = { power: '⚡', life: '🫁', comm: '📡' };
    function readings(k) {
      const R = T4.rd[k], bad = k === fault && !fixed;

        : `<p class="mini-note">${tr(T4.fixComm)}</p><div class="fix" dir="ltr"><svg class="cable" viewBox="0 0 300 120" id="cab"><rect x="10" y="40" width="40" height="40" rx="6" fill="#9aa6bd"/><path id="wire" d="M50 60 C 110 60, 120 100, 170 100" stroke="#2b2726" stroke-width="6" fill="none"/></svg><div class="sock" data-drop="sock">◉</div><div class="plug" id="plug">🔌</div></div>`;

  // ---------- Task 5: Mission emergency ----------
  const SYS5 = [

  function taskEmerg(el) {

  // ---------- Stamps, passport and flow ----------
  function passport(el, fresh) {
    const n = Object.keys(S.stamps).length;

  function award(i) {
    if (S.cleanup) { S.cleanup(); S.cleanup = null; }
    S.stamps[i] = true; S.next = Math.max(S.next, i + 1); S.cur = -1;
    doors[i].signM.map = signTex(String(i + 1), TASKS[i].ic, '#9ccc3c', true); doors[i].signM.needsUpdate = true; doors[i].panelM.emissive.set(0x9ccc3c);
    renderPassBtn(); SFX.stamp();
    try { localStorage.setItem('ja_progress', JSON.stringify({ level1: true, level2: Object.keys(S.stamps).map(Number) })); } catch (e) {}
    panel((el) => passport(el, i));
  }
  function afterPassport() {
    const n = Object.keys(S.stamps).length;
    if (n >= 5 && !S.launchOpen) {
      S.launchOpen = true; setObjective(null);
      showDialog([
        { who: 'nuri', expr: 'wow', en: 'All five stamps! The launch bay is open!', ar: 'الأختام الخمسة! منصة الإطلاق انفتحت!' },
      ], () => { SFX.whoosh(1); S.phase = 'launch'; setObjective('l2_launch'); giveControl(); });
    } else if (n < 5) { setObjective('l2_go'); cap(tr(TASKS[S.next].name), 2200); }
  }
  function enterTask(i) {
    S.cur = i; setObjective('l2_task'); SFX.whoosh(0);
    panel([taskDest, taskSuit, taskPack, taskSys, taskEmerg][i]);
  }
  function finish() {
    setObjective(null); SFX.fanfare();
    panel((el) => {
      el.innerHTML = `<div class="eyebrow">${tr(UI.eyebrow)}</div><h2>${tr(UI.doneT)}</h2><p>${tr(UI.doneP, playerName())}</p><div class="feedback good">🚀 ${tr(UI.next)}</div><h3>${tr(UI.learned)}</h3><ul class="notebook">${TASKS.map((tk) => `<li>${tk.stamp.ic} ${tr(LEARN[tk.id])}</li>`).join('')}</ul><div class="actions"><button class="btn ghost" id="again">${tr(UI.replay)}</button><button class="btn" id="restart">${tr(UI.restart)}</button></div>`;
      el.querySelector('#again').onclick = () => { closePanel(); start(); };
      el.querySelector('#restart').onclick = () => { closePanel(); $('passBtn').hidden = true; $('dnReplay').click(); };
    });
  }
  function renderPassBtn() { const b = $('passBtn'); b.hidden = G.scene !== 'level2'; b.textContent = `🎫 ${Object.keys(S.stamps).length}/5`; b.title = tr(UI.passT); }
  $('passBtn').addEventListener('click', () => { if (G.scene !== 'level2' || !G.control) return; panel((el) => passport(el)); });

  function action() {
    if (!G.control) return null;
    if (S.phase === 'launch') { const p = pin(LAUNCH_ANG); return { at: p, r: 2.8, text: tr(UI.launchAct), fn: finish }; }
    if (S.next >= 5) return null;
    // a locked door the child walks up to
    for (let i = S.next + 1; i < 5; i++) { if (S.stamps[i]) continue; const p = pin(TASKS[i].ang); if (Math.hypot(P.pos.x - p.x, P.pos.z - p.z) < 2.4) { if (!S.lockMsg || performance.now() - S.lockMsg > 4000) { S.lockMsg = performance.now(); cap(tr(UI.locked), 2400); } } }
    const i = S.next, p = pin(TASKS[i].ang);
    return { at: p, r: 2.6, text: tr(UI.enter, tr(TASKS[i].name)), fn: () => enterTask(i) };
  }
  function update(dt, time) {
    holo.rotation.y = time * 0.4; hRing.rotation.z = time * 0.3;
    beamH.material.opacity = 0.1 + 0.04 * Math.sin(time * 2);
    doors.forEach((d, i) => { const act = i === S.next && S.phase !== 'launch'; d.lightP.intensity = act ? 1.2 + 0.5 * Math.sin(time * 4) : S.stamps[i] ? 0.4 : 0; d.panelM.emissiveIntensity = act ? 0.6 + 0.3 * Math.sin(time * 4) : S.stamps[i] ? 0.5 : 0.18; });
    launch.panelM.emissiveIntensity = S.launchOpen ? 1.6 : 0.25 + 0.1 * Math.sin(time * 2);
    launch.panelM.emissive.set(S.launchOpen ? 0xfff3d0 : 0xec5a50);
    launch.panel.position.y = launch.hgt / 2 + (S.launchOpen ? Math.min(launch.hgt * 0.92, (launch.panel.position.y - launch.hgt / 2) + dt * 2) : 0);
    launch.lightP.intensity = S.launchOpen ? 2.5 : 0;
    const al = W.userData.alarm && !$('lvOverlay').hidden; hallLight.color.set(al && Math.sin(time * 6) > 0 ? 0xff4a3a : 0x9fdcff);
  }
  function start() {
    S = fresh(); G.scene = 'level2'; setEnv('academy');
    $('doneCard').hidden = true; $('lvOverlay').hidden = true; $('lvPanel').innerHTML = ''; closeChat(); G.chat = []; $('chatLog').innerHTML = '';
    doors.forEach((d, i) => { d.signM.map = signTex(String(i + 1), TASKS[i].ic, '#' + TASKS[i].col.toString(16).padStart(6, '0'), false); d.signM.needsUpdate = true; d.panelM.emissive.set(TASKS[i].col); });
    launch.panel.position.y = launch.hgt / 2; W.userData.alarm = false;
    ship.visible = false; setBeam(ship, 0);
    girl.visible = true; girl.scale.setScalar(1); girl.userData.reach = 0; setExpr(girl, 'wow');
    nuri.visible = true; G.nuriJoined = true; G.nuriMet = true; G.done = true; setExpr(nuri, 'happy');
    P.pos.set(0, 0, 7.2); P.vel.set(0, 0, 0); P.yaw = Math.PI; camYaw = 0; camPitch = 0.3; camDist = 4.8; followCamera(0, true); updateNuriFollow(1); nuri.position.copy(nuriTarget);
    $('helpBtn').hidden = false; $('helpLbl').textContent = t('help'); setObjective(null); renderPassBtn(); G.control = false;
    SFX.success();
    showDialog([
      { who: 'nuri', expr: 'happy', en: 'Welcome to the Academy! Finish 5 rooms to earn 5 stamps.', ar: 'أهلاً فيك بالأكاديمية! خلّص 5 غرف لتاخد 5 أختام.' },
    ], () => { setExpr(girl, 'happy'); setObjective('l2_go'); giveControl(); });
  }
  function relang() {
    renderPassBtn();
    if (G.scene !== 'level2' || $('lvOverlay').hidden || !S.panel) return;
    $('lvOverlay').dir = LANG === 'ar' ? 'rtl' : 'ltr';
    if (S.cur >= 0) return; // keep a task's progress; its labels update next time it opens
    S.panel($('lvPanel'));
  }
  const gid = () => (S.cur >= 0 ? TASKS[S.cur].id : 'hub');
  /*TESTHOOK2*/
  return {
    start, update, action, relang,
    panelOpen: () => !$('lvOverlay').hidden,
    qa: () => [{ q: UI.chipWhat, a: WHAT[gid()] }, { q: UI.chipHint, hint: true }, ...(gid() !== 'hub' ? [{ q: UI.chipWhy, a: SCI[gid()] }] : [])],
    hint: () => { const k = gid(), arr = HINTS[k], i = S.hint[k] || 0; S.hint[k] = i + 1; return tr(arr[Math.min(i, arr.length - 1)]); },
    context: () => `Current part of Level 2 (Junior Astronaut Training Academy): ${gid() === 'hub' ? 'walking around the academy hall to the next training room' : 'training room task "' + TASKS[S.cur].name.en + '"'}. Stamps collected: ${Object.keys(S.stamps).length} of 5. For your private knowledge only (never reveal it directly, only hint toward it step by step): ${SECRET[gid()]}`,
  };
})();

// ============================== Loop ==============================
function resize() { const w = stage.clientWidth, h = stage.clientHeight; if (!w || !h) return; renderer.setSize(w, h, false); camera.aspect = w / h; camera.updateProjectionMatrix(); }
new ResizeObserver(resize).observe(stage);
const clock = new T.Clock();
let titleT = 0;
function loop() {
  const dt = Math.min(0.05, clock.getDelta()), time = clock.elapsedTime;
  if (G.cine) { G.cine.t += dt; G.cine.update(G.cine.t, dt); if (G.cine && G.cine.t >= G.cine.dur) endCine(); }
  else if (G.scene === 'title') { titleT += dt; camera.position.set(2.7 + Math.sin(titleT * 0.25) * 0.4, 2.2, 3.3); camera.lookAt(-0.6, 0.8, -1.4); }
  else if (!G.dialog) { if (L1.roverMode()) L1.updateRover(dt); else { updatePlayer(dt); followCamera(dt); } }
  if (G.scene === 'level1') L1.update(dt, time);
  if (G.scene === 'level2') L2.update(dt, time);
  if (!G.control && !G.cine) { P.vel.x = P.vel.z = 0; P.speed = 0; }
  if (girl.visible) animateGirl(girl, G.cine || !G.control ? 0 : P.speed, dt, !P.onGround && !G.cine && G.control, time);
  if (nuri.visible) { animateNuri(nuri, time, dt); if (G.nuriJoined && !G.cine) updateNuriFollow(dt); }
  if (ship.visible) animateShip(ship, time);
  SFX.beam(ship.visible && ship.userData.len > 0.05);
  if (G.scene === 'bedroom' || G.scene === 'title') { const b = ENV.bedroom.userData.box; if (!G.boxOpened) { b.root.position.y = Math.abs(Math.sin(time * 2.5)) * 0.04; boxLight.position.set(b.root.position.x, 0.9, b.root.position.z); if (Math.random() < dt * 4) burst(new T.Vector3(b.root.position.x + (Math.random() - 0.5) * 0.6, 0.6, b.root.position.z + (Math.random() - 0.5) * 0.6), 0x8fd0ef, 1, 0.2, 0.5); } ENV.bedroom.userData.globe.rotation.y = time * 0.3; ENV.bedroom.userData.mobile.rotation.y = time * 0.25; }
  if (G.scene === 'desert' && G.control && !G.nuriMet) { G.desertTime += dt; const d = Math.hypot(P.pos.x - NURI_ROCK.x, P.pos.z - NURI_ROCK.z); if (d < 7.5 || G.desertTime > 16) meetNuri(); }
  if (G.scene === 'desert' || G.scene === 'landing' || G.scene === 'level1') { sun.position.copy(P.pos).add(new T.Vector3(30, 26, 18)); sun.target.position.copy(P.pos); }
  if (G.scene === 'yard') { sun.position.set(P.pos.x - 20, 30, P.pos.z - 20); sun.target.position.copy(P.pos); }
  sky.position.copy(camera.position); stars.position.copy(camera.position);
  updateSparks(dt);
  updateActionUI();
  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}

// ============================== Boot ==============================
setEnv('bedroom'); G.scene = 'title';
P.pos.set(-0.4, 0, 0.4); P.yaw = 0.6; girl.position.copy(P.pos); girl.rotation.y = P.yaw;
$('loading').remove(); resize(); applyLang(); $('titleScreen').hidden = false;
requestAnimationFrame(loop);
(async () => {
  if (!window.claude?.use) return;
  try { sample = await window.claude.use('sample'); } catch (e) { sample = null; }
  try { tts = await window.claude.use('tts'); } catch (e) { tts = null; }
  if (tts) $('voiceBtn').hidden = false;
  if (!$('chat').hidden) openChat();
})();
})();
</script>
