<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>html{color-scheme:light}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style></head><body>
<meta charset="utf-8">
<title>Junior Astronaut</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@500;600;700;800&family=Nunito:wght@500;600;700;800&display=swap">
<style>
/* Layout: a one-screen 3D game. The viewport fills the stage; rounded toy-like cards float over it for objectives, dialogue and the invitation. */
:root {
  color-scheme: dark;
  --deep: #101a33;
  --navy: #1f3a68;
  --cream: #f6f1e8;
  --paper: #fffaf0;
  --ink: #1d2742;
  --muted: #5d6680;
  --orange: #ec8a3c;
  --orange-dk: #b9611f;
  --red: #d8433a;
  --lime: #9ccc3c;
  --lime-dk: #6a9a1f;
  --sky: #8fd0ef;
  --gold: #c9a24a;
  --f-display: "Baloo Bhaijaan 2", "Nunito", system-ui, sans-serif;
  --f-body: "Nunito", "Baloo Bhaijaan 2", system-ui, sans-serif;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body {
  margin: 0; background: var(--deep); color: var(--cream); font-family: var(--f-body); font-size: 16px; line-height: 1.5;
  display: flex; flex-direction: column; overflow: hidden;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 12px;
}
.stage { position: relative; flex: 1; min-height: 0; border-radius: 18px; overflow: hidden; background: #000; touch-action: none; user-select: none; -webkit-user-select: none; box-shadow: 0 0 0 1px rgba(255,255,255,.08); }
.stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; cursor: grab; }
.stage canvas:active { cursor: grabbing; }
[dir="rtl"] .rtl-flip { direction: rtl; }

/* Generic toy card + buttons */
.card { background: var(--paper); color: var(--ink); border-radius: 18px; box-shadow: 0 8px 0 rgba(0,0,0,.18), 0 18px 40px rgba(0,0,0,.35); }
.btn { all: unset; box-sizing: border-box; cursor: pointer; font-family: var(--f-display); font-weight: 700; font-size: 18px; color: #fff; background: var(--orange); padding: 10px 22px 8px; border-radius: 14px; box-shadow: 0 5px 0 var(--orange-dk); transition: transform .08s, box-shadow .08s, filter .15s; text-align: center; line-height: 1.3; }
.btn:hover { filter: brightness(1.06); }
.btn:active { transform: translateY(3px); box-shadow: 0 2px 0 var(--orange-dk); }
.btn:focus-visible { outline: 3px solid var(--sky); outline-offset: 3px; }
.btn.green { background: var(--lime); box-shadow: 0 5px 0 var(--lime-dk); color: #1f2a08; }
.btn.ghost { background: rgba(255,255,255,.9); color: var(--ink); box-shadow: 0 5px 0 rgba(0,0,0,.2); }
.btn.small { font-size: 15px; padding: 7px 14px 5px; border-radius: 11px; }
.btn[disabled] { opacity: .5; pointer-events: none; }

/* HUD */
.topbar { position: absolute; top: 12px; left: 12px; right: 12px; display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; pointer-events: none; }
.objective { pointer-events: none; padding: 9px 16px 8px; max-width: min(420px, 70%); display: flex; gap: 10px; align-items: center; }
.objective .dot { width: 30px; height: 30px; flex: none; border-radius: 50%; background: var(--orange); display: grid; place-items: center; color: #fff; font-weight: 800; font-family: var(--f-display); }
.objective .k { font-size: 12px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: var(--orange-dk); line-height: 1.2; }
.objective .t { font-family: var(--f-display); font-weight: 700; font-size: 17px; line-height: 1.25; text-wrap: balance; }
.tools { display: flex; gap: 8px; pointer-events: auto; margin-inline-start: auto; }
.icon-btn { all: unset; cursor: pointer; min-width: 44px; height: 44px; padding: 0 12px; border-radius: 14px; background: rgba(255,250,240,.92); color: var(--ink); font-family: var(--f-display); font-weight: 700; font-size: 15px; display: grid; place-items: center; box-shadow: 0 4px 0 rgba(0,0,0,.2); }
.icon-btn:focus-visible { outline: 3px solid var(--sky); }
.icon-btn[aria-pressed="true"] { background: var(--lime); }
.marker { position: absolute; transform: translate(-50%, -100%); pointer-events: none; display: flex; flex-direction: column; align-items: center; }
.marker .pin { width: 26px; height: 26px; border-radius: 50% 50% 50% 0; transform: rotate(-45deg); background: var(--orange); border: 3px solid #fff; box-shadow: 0 3px 10px rgba(0,0,0,.35); animation: hop 1s ease-in-out infinite; }
@keyframes hop { 50% { translate: 0 -5px; } }
.prompt { position: absolute; left: 50%; bottom: 22px; transform: translateX(-50%); display: flex; align-items: center; gap: 10px; white-space: nowrap; }
.prompt kbd { font-family: var(--f-body); background: rgba(0,0,0,.18); border-radius: 7px; padding: 0 8px; font-size: 15px; }
.help-btn { position: absolute; right: 14px; bottom: 18px; display: flex; align-items: center; gap: 8px; }
.help-btn .face { width: 26px; height: 26px; border-radius: 50%; background: #c6ec6f; position: relative; }
.help-btn .face::before, .help-btn .face::after { content: ""; position: absolute; top: 8px; width: 7px; height: 9px; border-radius: 50%; background: #1b1530; }
.help-btn .face::before { left: 5px; } .help-btn .face::after { right: 5px; }
.skip { position: absolute; right: 14px; bottom: 18px; }
.hint-keys { position: absolute; left: 14px; bottom: 16px; font-size: 13px; font-weight: 700; background: rgba(16,26,51,.6); padding: 5px 11px; border-radius: 10px; pointer-events: none; }
.stick { position: absolute; left: 20px; bottom: 20px; width: 120px; height: 120px; border-radius: 50%; background: rgba(255,250,240,.18); border: 3px solid rgba(255,250,240,.5); touch-action: none; }
.stick .nub { position: absolute; left: 50%; top: 50%; width: 50px; height: 50px; margin: -25px 0 0 -25px; border-radius: 50%; background: rgba(255,250,240,.85); }

/* Caption + dialogue */
.caption { position: absolute; left: 50%; bottom: 84px; transform: translateX(-50%); max-width: min(640px, calc(100% - 32px)); text-align: center; font-family: var(--f-display); font-weight: 700; font-size: 20px; background: rgba(16,26,51,.72); padding: 8px 18px 6px; border-radius: 14px; text-wrap: balance; transition: opacity .35s; }
.dialog { position: absolute; left: 50%; bottom: 16px; transform: translateX(-50%); width: min(680px, calc(100% - 24px)); padding: 16px 18px 14px; display: grid; grid-template-columns: 64px 1fr; gap: 4px 14px; animation: pop .3s cubic-bezier(.2,1.4,.4,1); }
@keyframes pop { from { opacity: 0; transform: translate(-50%, 14px) scale(.96); } to { opacity: 1; transform: translateX(-50%); } }
.dialog .avatar { grid-row: 1 / 3; width: 64px; height: 64px; border-radius: 50%; background: radial-gradient(circle at 50% 40%, #c6ec6f, #8cc232); position: relative; box-shadow: inset 0 -4px 0 rgba(0,0,0,.12); }
.dialog .avatar::before, .dialog .avatar::after { content: ""; position: absolute; top: 20px; width: 15px; height: 21px; border-radius: 50%; background: #1b1530; box-shadow: inset -3px -3px 0 0 #1b1530, inset 3px 3px 0 0 rgba(255,255,255,.0); }
.dialog .avatar::before { left: 13px; transform: rotate(-12deg); } .dialog .avatar::after { right: 13px; transform: rotate(12deg); }
.dialog .avatar.narrator { background: radial-gradient(circle at 50% 40%, #ffd49a, var(--orange)); }
.dialog .avatar.narrator::before, .dialog .avatar.narrator::after { display: none; }
.dialog .who { font-family: var(--f-display); font-weight: 800; color: var(--lime-dk); font-size: 15px; line-height: 1.2; }
.dialog .who.narrator { color: var(--orange-dk); }
.dialog .line { font-size: 18px; font-weight: 600; min-height: 2.6em; }
.dialog .next { grid-column: 2; justify-self: end; margin-top: 4px; }
[dir="rtl"] .dialog .next { justify-self: start; }

/* Full-screen overlays */
.overlay { position: absolute; inset: 0; display: grid; place-items: center; padding: 16px; background: rgba(10,16,34,.55); backdrop-filter: blur(3px); overflow-y: auto; }
.title-card { width: min(520px, 100%); padding: 26px 26px 24px; display: flex; flex-direction: column; gap: 14px; text-align: center; }
.title-card h1 { font-family: var(--f-display); font-weight: 800; font-size: 40px; line-height: 1.05; margin: 0; color: var(--navy); text-wrap: balance; }
.title-card h1 span { color: var(--orange); }
.title-card .sub { font-family: var(--f-display); font-weight: 700; color: var(--red); font-size: 18px; margin-top: -6px; }
.title-card p { margin: 0; color: var(--muted); font-size: 15.5px; }
.field { display: flex; flex-direction: column; gap: 6px; text-align: start; }
.field label { font-weight: 800; font-size: 14px; color: var(--navy); }
.field input { font: inherit; font-size: 18px; font-weight: 700; padding: 10px 14px; border-radius: 12px; border: 2px solid #d9d2c3; background: #fff; color: var(--ink); }
.field input:focus { outline: none; border-color: var(--orange); }
.field small { color: var(--muted); font-size: 12.5px; }
.lang-row { display: flex; gap: 8px; justify-content: center; }
.seg { all: unset; cursor: pointer; padding: 6px 16px; border-radius: 10px; font-weight: 800; border: 2px solid #d9d2c3; color: var(--ink); font-family: var(--f-display); }
.seg[aria-pressed="true"] { background: var(--navy); border-color: var(--navy); color: #fff; }
.seg:focus-visible { outline: 3px solid var(--sky); }
.controls-mini { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px 14px; font-size: 13.5px; color: var(--muted); font-weight: 700; }
.controls-mini b { color: var(--ink); background: #efe8da; border-radius: 6px; padding: 0 6px; }

.invite-wrap { perspective: 1200px; }
.invite { width: min(560px, calc(100vw - 48px)); padding: 30px 30px 24px; display: flex; flex-direction: column; gap: 14px; position: relative; text-align: center; transform-origin: 50% 80%; animation: unfold .9s cubic-bezier(.2,1.2,.3,1) both; background:
  radial-gradient(circle at 12% 10%, rgba(236,138,60,.10), transparent 40%), radial-gradient(circle at 90% 92%, rgba(143,208,239,.18), transparent 45%), var(--paper); border: 3px solid #efe1c4; }
@keyframes unfold { from { opacity: 0; transform: rotateX(70deg) scale(.4) translateY(80px); } to { opacity: 1; transform: none; } }
.invite .patch { width: 104px; height: 104px; margin: -4px auto 0; filter: drop-shadow(0 4px 0 rgba(0,0,0,.12)); }
.invite .eyebrow { font-weight: 800; letter-spacing: .14em; text-transform: uppercase; font-size: 12.5px; color: var(--orange-dk); }
.invite h2 { font-family: var(--f-display); font-weight: 800; font-size: 34px; line-height: 1.05; margin: 0; color: var(--navy); }
.invite .body { font-size: 17px; color: var(--ink); max-width: 46ch; margin: 0 auto; display: flex; flex-direction: column; gap: 10px; }
.invite .body p { margin: 0; }
.invite .sig { font-family: var(--f-display); font-weight: 700; color: var(--navy); }
.invite .sig small { display: block; font-family: var(--f-body); color: var(--muted); font-weight: 600; font-size: 12.5px; }
.invite .stamp { position: absolute; top: 18px; inset-inline-end: 20px; transform: rotate(10deg); border: 3px solid var(--red); color: var(--red); font-family: var(--f-display); font-weight: 800; font-size: 13px; padding: 2px 9px 0; border-radius: 8px; letter-spacing: .06em; opacity: .85; }

.chat { position: absolute; top: 70px; bottom: 16px; inset-inline-end: 14px; width: min(380px, calc(100% - 28px)); display: flex; flex-direction: column; overflow: hidden; animation: pop2 .25s ease-out; }
@keyframes pop2 { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
.chat header { display: flex; align-items: center; gap: 10px; padding: 12px 14px; border-bottom: 2px solid #efe8da; }
.chat header .t { font-family: var(--f-display); font-weight: 800; font-size: 19px; flex: 1; color: var(--navy); line-height: 1.2; }
.chat header .t small { display: block; font-family: var(--f-body); font-size: 12px; color: var(--muted); font-weight: 700; }
.chat .log { flex: 1; overflow-y: auto; padding: 12px 14px; display: flex; flex-direction: column; gap: 9px; }
.bub { max-width: 88%; padding: 8px 12px; border-radius: 14px; font-size: 15.5px; font-weight: 600; line-height: 1.45; }
.bub.nuri { background: #eaf6d2; align-self: flex-start; border-end-start-radius: 4px; }
.bub.me { background: var(--navy); color: #fff; align-self: flex-end; border-end-end-radius: 4px; }
.bub.thinking { color: var(--muted); font-style: italic; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; padding: 0 14px 10px; }
.chip { all: unset; cursor: pointer; font-size: 13.5px; font-weight: 800; color: var(--navy); background: #fff; border: 2px solid #d9d2c3; padding: 4px 11px; border-radius: 999px; }
.chip:hover { border-color: var(--orange); }
.chip:focus-visible { outline: 3px solid var(--sky); }
.ask { display: flex; gap: 8px; padding: 10px 14px 14px; border-top: 2px solid #efe8da; }
.ask input { flex: 1; min-width: 0; font: inherit; font-size: 15.5px; font-weight: 600; padding: 8px 12px; border-radius: 11px; border: 2px solid #d9d2c3; color: var(--ink); background: #fff; }
.ask input:focus { outline: none; border-color: var(--lime-dk); }
.note { font-size: 12px; color: var(--muted); padding: 0 14px 12px; font-weight: 600; }

.done { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); width: min(460px, calc(100% - 32px)); padding: 22px; text-align: center; display: flex; flex-direction: column; gap: 10px; }
.done h3 { font-family: var(--f-display); font-weight: 800; font-size: 28px; margin: 0; color: var(--navy); line-height: 1.1; }
.done p { margin: 0; color: var(--muted); }
.done .row { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin-top: 4px; }

.fade { position: absolute; inset: 0; background: #070b18; opacity: 0; pointer-events: none; transition: opacity .6s ease; }
.fade.on { opacity: 1; }
.fade.white { background: #f4fff0; }
.loading { position: absolute; inset: 0; display: grid; place-items: center; font-family: var(--f-display); font-size: 20px; color: var(--cream); }

/* ---------- Level 1 ---------- */
.help-btn { z-index: 5; } .chat { z-index: 6; }
.dialog .avatar.lina { background: radial-gradient(circle at 50% 38%, #e3a77c, #9a5b36); }
.dialog .avatar.lina::before, .dialog .avatar.lina::after { top: 26px; width: 9px; height: 11px; }
.meters { position: absolute; top: 86px; inset-inline-start: 12px; width: 214px; padding: 10px 12px; display: flex; flex-direction: column; gap: 6px; pointer-events: none; }
.meter { display: grid; grid-template-columns: 22px 1fr 30px; gap: 6px; align-items: center; font-size: 13px; font-weight: 800; color: var(--ink); }
.meter .ic { font-size: 16px; line-height: 1; }
.meter .bar { height: 10px; background: #ece4d4; border-radius: 6px; overflow: hidden; }
.meter .fill { height: 100%; border-radius: 6px; background: var(--c); transition: width .4s; }
.meter .n { text-align: end; font-variant-numeric: tabular-nums; color: var(--muted); font-size: 12px; }
.meter.low .fill { animation: blink .8s infinite; }
@keyframes blink { 50% { opacity: .35; } }
.meters .sci { display: flex; justify-content: space-between; font-weight: 800; font-size: 13.5px; border-top: 2px dashed #ece4d4; padding-top: 6px; color: var(--navy); }
.inv { position: absolute; left: 50%; bottom: 14px; transform: translateX(-50%); display: flex; gap: 8px; padding: 8px; border-radius: 18px; background: rgba(16,26,51,.55); }
.slot { all: unset; cursor: pointer; position: relative; width: 52px; height: 52px; border-radius: 13px; background: var(--paper); display: grid; place-items: center; font-size: 27px; box-shadow: 0 4px 0 rgba(0,0,0,.22); }
.slot:focus-visible { outline: 3px solid var(--sky); }
.slot .k { position: absolute; top: 1px; inset-inline-start: 5px; font-size: 11px; font-weight: 800; color: var(--muted); }
.slot .u { position: absolute; bottom: -5px; inset-inline-end: -5px; min-width: 20px; height: 20px; padding: 0 5px; border-radius: 10px; background: var(--orange); color: #fff; font-size: 12px; font-weight: 800; display: grid; place-items: center; }
.slot.passive .u { background: var(--lime-dk); }
.slot.used-up { opacity: .45; }
.lv1 .prompt { bottom: 90px; } .lv1 .caption { bottom: auto; top: 84px; } .lv1 .hint-keys { display: none; } .lv1 .help-btn { bottom: 90px; } .lv1 .stick { bottom: 90px; }
#lvOverlay { padding-bottom: 76px; }
.lv1:has(#lvOverlay:not([hidden])) .help-btn { bottom: 14px; }
.lvp { width: min(640px, 100%); max-height: 100%; overflow-y: auto; padding: 22px 22px 20px; display: flex; flex-direction: column; gap: 14px; animation: pop2 .25s ease-out; }
.lvp .eyebrow { font-weight: 800; letter-spacing: .12em; text-transform: uppercase; font-size: 12.5px; color: var(--orange-dk); }
.lvp h2 { font-family: var(--f-display); font-weight: 800; font-size: 28px; line-height: 1.1; margin: 0; color: var(--navy); text-wrap: balance; }
.lvp p { margin: 0; color: var(--ink); font-size: 16px; }
.lvp .actions { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; justify-content: space-between; }
.facts { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 10px; }
.fact { background: #fff; border: 2px solid #efe1c4; border-radius: 14px; padding: 10px 12px; display: flex; flex-direction: column; gap: 3px; }
.fact .ic { font-size: 26px; line-height: 1.1; }
.fact b { font-family: var(--f-display); color: var(--navy); font-size: 16.5px; line-height: 1.2; }
.fact span { font-size: 14.5px; color: var(--ink); }
.science { background: #eef7fd; border: 2px solid #cfe7f5; border-radius: 14px; padding: 12px 14px; display: flex; flex-direction: column; gap: 4px; }
.science .k { font-weight: 800; font-size: 12px; letter-spacing: .1em; text-transform: uppercase; color: #2a6f98; }
.science p { font-size: 15px; }
.src { font-size: 12px; color: var(--muted); font-weight: 700; }
.items { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.item { all: unset; box-sizing: border-box; cursor: pointer; background: #fff; border: 3px solid #e8dfcd; border-radius: 14px; padding: 8px 6px; text-align: center; display: flex; flex-direction: column; align-items: center; gap: 2px; }
.item .ic { font-size: 32px; line-height: 1.2; }
.item b { font-size: 14px; color: var(--navy); line-height: 1.2; }
.item[aria-pressed="true"] { border-color: var(--lime-dk); background: #f1f9e0; box-shadow: 0 0 0 3px rgba(156,204,60,.35); }
.item:focus-visible { outline: 3px solid var(--sky); }
.count { font-weight: 800; color: var(--navy); font-size: 16px; }
.opts { display: flex; flex-direction: column; gap: 8px; }
.opt { all: unset; box-sizing: border-box; cursor: pointer; background: #fff; border: 3px solid #e8dfcd; border-radius: 14px; padding: 10px 14px; font-weight: 700; color: var(--ink); font-size: 15.5px; }
.opt:hover { border-color: var(--orange); }
.opt.right { border-color: var(--lime-dk); background: #f1f9e0; }
.opt.wrong { border-color: var(--red); background: #fdecea; }
.opt[disabled] { opacity: .45; pointer-events: none; }
.opt:focus-visible { outline: 3px solid var(--sky); }
.opt small { display: block; font-weight: 700; color: var(--muted); font-size: 13px; }
.feedback { border-radius: 14px; padding: 10px 14px; font-weight: 700; font-size: 15px; }
.feedback.good { background: #eaf6d2; color: #2f4a0a; } .feedback.try { background: #fff1dc; color: #6a3a0a; }
.samples { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.sample { background: #fff; border: 2px solid #efe1c4; border-radius: 14px; padding: 10px; display: flex; flex-direction: column; gap: 6px; text-align: center; }
.sample .ic { font-size: 26px; }
.sample b { color: var(--navy); font-family: var(--f-display); font-size: 15px; line-height: 1.2; }
.mini { font-size: 12px; font-weight: 800; color: var(--muted); text-align: start; }
.mbar { height: 10px; border-radius: 6px; background: #ece4d4; overflow: hidden; }
.mbar i { display: block; height: 100%; background: var(--sky); border-radius: 6px; width: 0; transition: width 1.4s ease-out; }
.mbar.life i { background: var(--lime); }
.sort { display: flex; flex-direction: column; gap: 8px; }
.srow { background: #fff; border: 2px solid #efe1c4; border-radius: 14px; padding: 9px 11px; display: flex; flex-direction: column; gap: 6px; }
.srow .st { font-weight: 700; font-size: 15px; color: var(--ink); }
.srow .bs { display: flex; gap: 6px; flex-wrap: wrap; }
.sb { all: unset; cursor: pointer; padding: 3px 12px; border-radius: 999px; border: 2px solid #d9d2c3; font-weight: 800; font-size: 13.5px; color: var(--navy); }
.sb[aria-pressed="true"] { background: var(--navy); color: #fff; border-color: var(--navy); }
.sb:focus-visible { outline: 3px solid var(--sky); }
.srow.ok { border-color: var(--lime-dk); background: #f6fbea; } .srow.no { border-color: var(--red); }
.srow .why { font-size: 13.5px; color: var(--muted); font-weight: 600; }
.badges { display: grid; grid-template-columns: repeat(auto-fill, minmax(118px, 1fr)); gap: 8px; }
.badge { background: #fff; border: 2px solid #efe1c4; border-radius: 14px; padding: 8px; text-align: center; font-weight: 800; font-size: 13.5px; color: var(--navy); }
.badge .ic { font-size: 28px; display: block; }
.badge.off { opacity: .35; filter: grayscale(1); }
.notebook { display: flex; flex-direction: column; gap: 6px; margin: 0; padding-inline-start: 20px; color: var(--ink); }
.notebook li { font-size: 14.5px; }

$('askForm').addEventListener('submit', async (e) => {
  e.preventDefault(); const q = $('askInput').value.trim(); if (!q || !sample) return;
  $('askInput').value = ''; addBubble('me', q); G.chat.push({ role: 'user', content: q }); G.chat = G.chat.slice(-8);
  const b = addBubble('nuri', t('thinking')); b.classList.add('thinking'); $('askSend').disabled = true; setExpr(nuri, 'idle');
  aiCtl = new AbortController();
  try {
    const turns = [{ role: 'user', content: RULES() }, ...G.chat];
    const { text } = await sample(turns, { modelTier: 'quick', cache: false, signal: aiCtl.signal, onText: ({ text }) => { b.classList.remove('thinking'); b.textContent = text; $('chatLog').scrollTop = 1e6; } });
    b.textContent = text; G.chat.push({ role: 'assistant', content: text }); setExpr(nuri, 'happy'); setTimeout(() => setExpr(nuri, 'idle'), 1500); say(text, 'nuri');
  } catch (err) {
    b.classList.remove('thinking');
    if (err && (err.code === 'not_granted' || err.code === 'sampling_disabled' || err.code === 'not_declared' || err.code === 'capability_disabled')) { sample = null; $('askForm').hidden = true; $('askNote').textContent = t('noteNoAI'); b.remove(); }
    else if (err && err.code === 'cancelled') b.remove();
    else b.textContent = (err && err.text) || t('aiErr');
    G.chat.pop();
  } finally { $('askSend').disabled = false; }
});

// ============================== Title + language ==============================
function applyLang() {
  document.documentElement.lang = LANG; $('langBtn').textContent = LANG === 'ar' ? 'English' : 'عربي';
  document.querySelectorAll('.seg').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.lang === LANG)));
  const ts = $('titleScreen'); ts.dir = LANG === 'ar' ? 'rtl' : 'ltr';
  $('tTitle').innerHTML = t('title'); $('tSub').textContent = t('sub'); $('tIntro').textContent = t('intro');
  $('tNameLbl').textContent = t('nameLbl'); $('tNameNote').textContent = t('nameNote'); $('nameInput').placeholder = t('defaultName');
  $('tControls').innerHTML = coarse ? t('controlsTouch') : t('controlsDesk'); $('startBtn').textContent = t('start');
  $('keysHint').textContent = t('keysHint'); $('helpLbl').textContent = t('help'); $('skipL1Btn').textContent = t('skipL1');
  L1.relang();
  for (const id of ['dialog', 'caption', 'objective', 'prompt', 'skipBtn']) $(id).dir = LANG === 'ar' ? 'rtl' : 'ltr';
  document.querySelector('.topbar').dir = LANG === 'ar' ? 'rtl' : 'ltr';
  if (G.objective) setObjective(G.objective);
  if (G.dialog) renderDialog();
  if (!$('inviteScreen').hidden) showInvite();
  if (!$('chat').hidden) { $('chatLog').innerHTML = ''; openChat(); }
  if (!$('doneCard').hidden) showDone();
  $('skipBtn').textContent = t('skip');
}
document.querySelectorAll('.seg').forEach((b) => b.addEventListener('click', () => { LANG = b.dataset.lang; applyLang(); }));
$('langBtn').addEventListener('click', () => { LANG = LANG === 'ar' ? 'en' : 'ar'; applyLang(); });
$('startBtn').addEventListener('click', () => { G.name = $('nameInput').value; $('titleScreen').hidden = true; startBedroom(); });
$('skipL1Btn').addEventListener('click', () => { G.name = $('nameInput').value; $('titleScreen').hidden = true; L1.start(); });
$('nameInput').addEventListener('keydown', (e) => { if (e.key === 'Enter') $('startBtn').click(); });

        S.items.includes('jacket') ? { who: 'lina', en: 'Good thing you packed a jacket!', ar: 'منيح إنك جبت جاكيت!' } : { who: 'lina', en: 'No jacket? Here, borrow my spare blanket. Remember: Mars nights are MUCH colder, so astronauts need heated habitats.', ar: 'ما جبت جاكيت؟ خذ، استعير بطانيتي. وتذكّر: ليالي المريخ أبرد بكثير، فرواد الفضاء بيحتاجوا مساكن مدفّاية.' },
        { who: 'lina', en: 'The Atacama has some of the world’s biggest telescopes, because the air is very dry and the sky is clear. Let’s use ours on the hill!', ar: 'بأتاكاما في مراصد من أكبر المراصد بالعالم، لأن الهوا جاف كثير والسما صافية. يلا نستخدم التلسكوب تبعنا عالتلة!' },
      ];
      if (!S.items.includes('jacket')) S.m.energy = Math.max(10, S.m.energy - 10);
      if (!S.items.includes('flashlight')) lines.push({ who: 'nuri', expr: 'happy', en: 'No flashlight? No problem. I’ll glow for you!', ar: 'ما في مصباح؟ ولا يهمك. أنا بضوّيلك!' });
      note(SCI.night);
      showDialog(lines, () => setStep('scope'));
    }, false);
  }
  // telescope mini-game
  const sky2 = { w: 1700, h: 1100, stars: [], mars: { x: 0, y: 0 }, vx: 0, vy: 0, found: false };
  function scopeOpen() {
    G.control = false; sky2.stars = Array.from({ length: 420 }, () => ({ x: Math.random() * sky2.w, y: Math.random() * sky2.h, r: Math.random() * 1.6 + 0.4, p: Math.random() * 7 }));
    sky2.mars = { x: 1250 + Math.random() * 250, y: 250 + Math.random() * 500 }; sky2.vx = 350; sky2.vy = 550; sky2.found = false;
    $('scope').hidden = false; $('scope').dir = LANG === 'ar' ? 'rtl' : 'ltr'; $('scopeTip').textContent = tr(UI.scopeTip); $('scopeClose').textContent = tr(UI.scopeClose); scopeDraw(0);
  }
  let scopeDrag = null;
  const cvs = $('scopeCv'), sctx = cvs.getContext('2d');
  function scopeDraw(time) {
    const W2 = cvs.width, H2 = cvs.height; sctx.fillStyle = '#03061a'; sctx.fillRect(0, 0, W2, H2);
    const ox = sky2.vx - W2 / 2, oy = sky2.vy - H2 / 2;
    for (const s of sky2.stars) { const x = s.x - ox, y = s.y - oy; if (x < -5 || y < -5 || x > W2 + 5 || y > H2 + 5) continue; const tw = 0.55 + 0.45 * Math.sin(time * 3 + s.p * 5); sctx.fillStyle = `rgba(235,240,255,${tw})`; sctx.beginPath(); sctx.arc(x, y, s.r, 0, 7); sctx.fill(); }
    const mx = sky2.mars.x - ox, my = sky2.mars.y - oy;
    const g = sctx.createRadialGradient(mx, my, 0, mx, my, 14); g.addColorStop(0, 'rgba(255,170,120,1)'); g.addColorStop(0.35, 'rgba(240,110,70,.9)'); g.addColorStop(1, 'rgba(240,110,70,0)'); sctx.fillStyle = g; sctx.beginPath(); sctx.arc(mx, my, 14, 0, 7); sctx.fill();
    if (sky2.found) { sctx.strokeStyle = '#9ccc3c'; sctx.lineWidth = 3; sctx.beginPath(); sctx.arc(mx, my, 26, 0, 7); sctx.stroke(); sctx.fillStyle = '#fff'; sctx.font = '800 22px Nunito, sans-serif'; sctx.textAlign = 'center'; sctx.fillText(tr(UI.mars), mx, my - 36); }
    sctx.strokeStyle = 'rgba(140,200,255,.35)'; sctx.lineWidth = 1; sctx.beginPath(); sctx.moveTo(W2 / 2 - 20, H2 / 2); sctx.lineTo(W2 / 2 + 20, H2 / 2); sctx.moveTo(W2 / 2, H2 / 2 - 20); sctx.lineTo(W2 / 2, H2 / 2 + 20); sctx.stroke();
  }
  cvs.addEventListener('pointerdown', (e) => { scopeDrag = { x: e.clientX, y: e.clientY, sx: e.clientX, sy: e.clientY }; cvs.setPointerCapture(e.pointerId); });
  cvs.addEventListener('pointermove', (e) => { if (!scopeDrag || sky2.found) return; const k = cvs.width / cvs.getBoundingClientRect().width; sky2.vx = Math.max(270, Math.min(sky2.w - 270, sky2.vx - (e.clientX - scopeDrag.x) * k)); sky2.vy = Math.max(270, Math.min(sky2.h - 270, sky2.vy - (e.clientY - scopeDrag.y) * k)); scopeDrag.x = e.clientX; scopeDrag.y = e.clientY; });
  cvs.addEventListener('pointerup', (e) => {
    if (!scopeDrag) return; const moved = Math.hypot(e.clientX - scopeDrag.sx, e.clientY - scopeDrag.sy); scopeDrag = null; if (moved > 8 || sky2.found) return;
    const r = cvs.getBoundingClientRect(), k = cvs.width / r.width, x = (e.clientX - r.left) * k + sky2.vx - cvs.width / 2, y = (e.clientY - r.top) * k + sky2.vy - cvs.height / 2;
    if (Math.hypot(x - sky2.mars.x, y - sky2.mars.y) < 22) { sky2.found = true; $('scopeTip').textContent = tr(UI.found); setTimeout(() => { $('scope').hidden = true; addSci(10); badge('stars'); note(SCI.mars); panel((el) => { el.innerHTML = `<div class="eyebrow">${tr(UI.eyebrow)}</div><h2>${tr(UI.found)}</h2>${science(SCI.mars)}<button class="btn green" id="go">${tr(UI.cont)}</button>`; el.querySelector('#go').onclick = () => { setStep('done'); summary(); }; }); }, 1500); }
  });
  $('scopeClose').addEventListener('click', () => { $('scope').hidden = true; giveControl(); });
  addEventListener('keydown', (e) => { if ($('scope').hidden) return; const d = 40; if (e.code === 'ArrowLeft') sky2.vx = Math.max(270, sky2.vx - d); if (e.code === 'ArrowRight') sky2.vx = Math.min(sky2.w - 270, sky2.vx + d); if (e.code === 'ArrowUp') sky2.vy = Math.max(270, sky2.vy - d); if (e.code === 'ArrowDown') sky2.vy = Math.min(sky2.h - 270, sky2.vy + d); });
  function summary() {
    try { localStorage.setItem('ja_progress', JSON.stringify({ level1: { science: S.science, badges: Object.keys(S.badges) } })); } catch (e) {}
    $('inv').hidden = true; $('meters').hidden = true; setObjective('l1_done');
    panel((el) => {
      el.innerHTML = `<div class="eyebrow">${tr(UI.eyebrow)}</div><h2>${tr(UI.doneT)}</h2><p>${tr(UI.doneP, playerName())}</p>
        <div class="facts"><div class="fact"><span class="ic">⭐</span><b>${S.science}</b><span>${tr(UI.pts)}</span></div><div class="fact"><span class="ic">🏅</span><b>${Object.keys(S.badges).length} / 6</b><span>${tr(UI.badgesT)}</span></div></div>
        <h3>${tr(UI.badgesT)}</h3><div class="badges">${Object.keys(BADGES).map((k) => `<div class="badge ${S.badges[k] ? '' : 'off'}"><span class="ic">${BADGES[k].ic}</span>${tr(BADGES[k])}</div>`).join('')}</div>
        <h3>${tr(UI.nbT)}</h3><ul class="notebook">${S.notes.map((n) => `<li>${tr(n)}</li>`).join('')}</ul>
        <h3>${tr(UI.carryT)}</h3><p>${tr(UI.carry)}</p>
        <div class="actions"><button class="btn ghost" id="again">${tr(UI.replay)}</button><button class="btn" disabled>${tr(UI.next)}</button></div>`;
      el.querySelector('#again').onclick = () => { closePanel(); start(); };
    });
  }

  // ---- Steps ----
  function setStep(st) {
    S.step = st; S.hint[group()] = S.hint[group()] || 0;
    spotRings.forEach((r, i) => (r.visible = st === 'collect' && !S.got[POS.spots[i].k]));
    flag.visible = st === 'drive' || st === 'go3';
    if (st !== 'done') setObjective('l1_' + st);
    if (!S.panel && !G.dialog && !G.cine) giveControl();
    renderMeters(); renderInv();
  }
  function action() {
    if (!G.control) return null;
    const near = (p, r) => Math.hypot(P.pos.x - p.x, P.pos.z - p.z) < r;
    let prim = null;
    const A = (p, r, key, fn) => ({ at: new T.Vector3(p.x, gy(p.x, p.z), p.z), r, text: tr(ACT[key]), fn });
    switch (S.step) {
      case 'go1': prim = A(POS.s1, 2.4, 'go1', s1Card); break;
      case 'collect': { let best = null, bd = 1e9; POS.spots.forEach((s) => { if (S.got[s.k]) return; const d = Math.hypot(P.pos.x - s.x, P.pos.z - s.z); if (d < bd) { bd = d; best = s; } }); if (best) prim = A(best, 1.6, 'collect', () => scoop(best)); break; }
      case 'test': prim = A(POS.lab, 2.2, 'test', labPanel); break;
      case 'go2': prim = A(POS.s2, 2.8, 'go2', crackRock); break;
      case 'go3': prim = A(POS.rover, 2.6, 'go3', s3Card); break;
      case 'go4': prim = A(POS.s4, 2.8, 'go4', sortPanel); break;
      case 'ret': prim = A(POS.lina, 2.6, 'ret', sunset); break;
      case 'scope': prim = A(POS.scope, 2.0, 'scope', scopeOpen); break;
    }
    if (S.items.length && S.step !== 'done' && near(POS.cooler, 2.3) && !(prim && near(prim.at, prim.r))) return A(POS.cooler, 2.3, 'cooler', refill);
    return prim;
  }
  function scoop(s) {
    G.control = false; S.got[s.k] = true; S.count++;
    runCine(1.0, (tt) => { girl.userData.body.rotation.x = Math.sin(Math.min(1, tt) * Math.PI) * 0.45; if (tt < 0.05) burst(new T.Vector3(s.x, gy(s.x, s.z) + 0.2, s.z), 0xd9a066, 16, 1, 0.8); followCamera(0.016); }, () => {
      girl.userData.body.rotation.x = 0; spotRings.forEach((r, i) => (r.visible = !S.got[POS.spots[i].k]));
      caption2(`${UI.spotIc[s.k]} ${tr(UI.spot[s.k])} ✓`, 1800);
      if (S.count >= 3) setStep('test'); else { setObjective('l1_collect'); giveControl(); }
    }, false);
  }
  function refill() {
    if (S.items.includes('water')) S.uses.water = ITEMS.water.uses;
    S.m.water = 100; S.m.energy = Math.min(100, S.m.energy + 25); S.m.sun = Math.min(100, S.m.sun + 30); S.warned = {};
    burst(P.pos.clone().add(new T.Vector3(0, 1.2, 0)), 0x8fd0ef, 16, 0.8, 1); caption2(tr(UI.refilled)); renderMeters(); renderInv();
  }
  function rescue(k) {
    G.control = false; fade(true);
    setTimeout(() => { P.pos.set(POS.camp.x + 3.5, 0, POS.camp.z + 2.5); P.pos.y = gy(P.pos.x, P.pos.z); for (const m in S.m) S.m[m] = Math.max(S.m[m], 70); if (S.items.includes('water')) S.uses.water = ITEMS.water.uses; S.warned = {}; followCamera(0, true); fade(false); renderMeters(); renderInv(); caption2(tr(UI.rescue) + ' ' + tr(UI.low[k]), 5000); giveControl(); }, 700);
  }

  // ---- Per-frame ----
  const cDay = { top: new T.Color('#5d9bd4'), bot: new T.Color('#f5cf9f'), fog: new T.Color('#f1c79a') }, cNight = { top: new T.Color('#050a1e'), bot: new T.Color('#1b2a55'), fog: new T.Color('#0e1838') };
  let hudT = 0;
  function update(dt, time) {
    // night transition
    S.night += ((S.nightT || 0) - S.night) * Math.min(1, dt * 0.45);
    const n = S.night;
    skyMat.uniforms.top.value.copy(cDay.top).lerp(cNight.top, n); skyMat.uniforms.bottom.value.copy(cDay.bot).lerp(cNight.bot, n);
    skyMat.uniforms.sunAmt.value = 1 - n; skyMat.uniforms.sunDir.value.set(30, 26 - n * 40, 18).normalize();
    scene.fog.color.copy(cDay.fog).lerp(cNight.fog, n);
    stars.visible = n > 0.05; starMat.opacity = Math.max(0, n - 0.2) * 1.25;
    hemi.intensity = 0.7 - n * 0.42; hemi.color.set(0xfff0dc).lerp(new T.Color(0x8aa0e0), n);
    sun.intensity = 1.45 - n * 1.15; sun.color.set(0xffe0b8).lerp(new T.Color(0xa8b8ff), n);
    nuriLight.intensity = n > 0.3 ? (S.items.includes('flashlight') ? 0.8 : 2.2) * n : 0; nuriLight.position.copy(nuri.position);
    torch.intensity = n > 0.3 && S.items.includes('flashlight') ? 2.2 * n : 0;
    torch.position.set(P.pos.x, P.pos.y + 1.1, P.pos.z); torch.target.position.set(P.pos.x + Math.sin(P.yaw) * 6, P.pos.y, P.pos.z + Math.cos(P.yaw) * 6);
    // NPCs and props
    animateGirl(lina, 0, dt, false, time); const lf = Math.atan2(P.pos.x - lina.position.x, P.pos.z - lina.position.z); let dl = lf - lina.rotation.y; dl = Math.atan2(Math.sin(dl), Math.cos(dl)); lina.rotation.y += dl * Math.min(1, dt * 2);
    spotRings.forEach((r, i) => { r.children[0].scale.setScalar(1 + 0.12 * Math.sin(time * 3 + i)); });
    flagRing.scale.setScalar(1 + 0.1 * Math.sin(time * 3));
    // survival meters (daytime exploring only)
    const active = G.control && !S.rover && !['brief', 'pack', 'done', 'scope'].includes(S.step) && S.items.length;
    if (active) {
      const run = P.speed > 3.5 ? 1.5 : 1;
      S.m.water -= dt * 0.11 * run;
      S.m.energy -= dt * (0.055 + (P.speed > 0.5 ? 0.03 : 0)) * run;
      if (n < 0.3) { let k = 0.15; if (S.items.includes('hat')) k *= 0.6; if (S.items.includes('umbrella')) k *= 0.8; S.m.sun -= dt * k; }
      for (const k of ['water', 'energy', 'sun']) {
        if (S.m[k] < 25 && !S.warned[k]) { S.warned[k] = true; caption2(tr(UI.low[k]), 4200); }
        if (S.m[k] > 40) S.warned[k] = false;
        if (S.m[k] <= 0) { S.m[k] = 0; rescue(k); break; }
      }
    }
    hudT += dt; if (hudT > 0.25) { hudT = 0; renderMeters(); }
    if (!$('scope').hidden) scopeDraw(time);
  }

  // ---- Public ----
  function start() {
    S = fresh(); S.tries.s4 = 0;
    G.scene = 'level1'; setEnv('desert'); stage.classList.add('lv1');
    $('doneCard').hidden = true; $('lvOverlay').hidden = true; $('scope').hidden = true; closeChat();
    ship.visible = true; ship.position.set(0, 6.2, -2); setBeam(ship, 0);
    girl.visible = true; girl.scale.setScalar(1); girl.userData.reach = 0; setExpr(girl, 'happy');
    P.pos.set(POS.camp.x + 3.2, 0, POS.camp.z + 2.6); P.pos.y = gy(P.pos.x, P.pos.z); P.vel.set(0, 0, 0); P.yaw = Math.atan2(POS.lina.x - P.pos.x, POS.lina.z - P.pos.z);
    camYaw = P.yaw + Math.PI + 0.5; camPitch = 0.3; camDist = 5; followCamera(0, true);
    nuri.visible = true; G.nuriJoined = true; G.nuriMet = true; G.done = true; setExpr(nuri, 'idle'); updateNuriFollow(1); nuri.position.copy(nuriTarget);
    $('helpBtn').hidden = false; $('helpLbl').textContent = t('help'); G.chat = [];
    halves.forEach((h) => { h.position.z = 0; h.rotation.x = 0; }); saltRock.rotation.y = 0;
    resetRover(); $('meters').hidden = true; $('inv').hidden = true; setStep('brief'); G.control = false;
    showDialog([
      { who: 'lina', en: (nm) => `Welcome to our research camp, ${nm}! I’m Dr. Lina. I study how tiny living things survive in extreme places.`, ar: (nm) => `أهلاً فيك بمخيم البحث يا ${nm}! أنا د. لينا. بدرس كيف الكائنات الحية الصغيرة بتعيش بالأماكن القاسية.` },
      { who: 'lina', en: 'Today you’ll explore the Atacama like a real Mars scientist. There are four science stations out there.', ar: 'اليوم رح تستكشف أتاكاما متل عالم مريخ حقيقي. في أربع محطات علمية برّا.' },
      { who: 'lina', en: 'But first, pack your backpack. You can carry only 5 things, so choose wisely!', ar: 'بس أول اشي، جهّز شنطتك. بتقدر تحمل 5 أغراض بس، فاختار بذكاء!' },
      { who: 'nuri', expr: 'happy', en: 'Ooh, a decision! I can give you hints, but you choose.', ar: 'أوه، قرار! أنا بعطيك تلميحات، بس إنت اللي بتختار.' },
    ], () => { setStep('pack'); panel(packPanel); });
  }
  function relang() {
    if (G.scene !== 'level1') return;
    renderMeters(); renderInv();
    if (S.panel && !$('lvOverlay').hidden) { $('lvOverlay').dir = LANG === 'ar' ? 'rtl' : 'ltr'; S.panel($('lvPanel')); }
    if (!$('scope').hidden) { $('scopeTip').textContent = tr(sky2.found ? UI.found : UI.scopeTip); $('scopeClose').textContent = tr(UI.scopeClose); }
  }
  return {
    start, update, updateRover, action, relang,
    roverMode: () => G.scene === 'level1' && S.rover && !S.panel,
    panelOpen: () => !$('lvOverlay').hidden || !$('scope').hidden,
    qa: () => { const gr = group(); return [{ q: UI.chipHint, hint: true }, { q: UI.chipWhy, a: WHY[gr] }, { q: UI.chipExplain, a: EXPLAIN[gr] }]; },
    hint: () => { const gr = group(), arr = HINTS1[gr], i = S.hint[gr] || 0; S.hint[gr] = i + 1; return tr(arr[Math.min(i, arr.length - 1)]); },
    context: () => {
      const gr = group();
      const secret = { pack: 'There is no single right answer; the useful items are water, sunscreen, hat, jacket, flashlight and snacks, and the child must leave one out.', s1: 'The correct answer is the salt crust sample, because it held the most water.', s2: 'The correct answer is that salt pulls water vapor from the air and the rock shades the microbes from sunlight.', s3: 'Deeper drilling finds better-protected samples, but costs more battery.', s4: 'Answers: breathable air = Atacama; extremely dry = both; average about -60 C = Mars; perchlorate salts = both; blue sunsets = Mars; two moons = Mars.', night: 'Mars is the steady reddish-orange dot in the telescope view.' }[gr];
      return `Current part of Level 1 ("Atacama Explorer"): ${tr.call(null, OBJ[S.step] || OBJ.brief).toString()} For your private knowledge only (never reveal it directly, only hint toward it step by step): ${secret}`;
    },
  };
})();

// ============================== Loop ==============================
function resize() { const w = stage.clientWidth, h = stage.clientHeight; if (!w || !h) return; renderer.setSize(w, h, false); camera.aspect = w / h; camera.updateProjectionMatrix(); }
new ResizeObserver(resize).observe(stage);
const clock = new T.Clock();
let titleT = 0;
function loop() {
  const dt = Math.min(0.05, clock.getDelta()), time = clock.elapsedTime;
  if (G.cine) { G.cine.t += dt; G.cine.update(G.cine.t, dt); if (G.cine && G.cine.t >= G.cine.dur) endCine(); }
  else if (G.scene === 'title') { titleT += dt; camera.position.set(2.7 + Math.sin(titleT * 0.25) * 0.4, 2.2, 3.3); camera.lookAt(-0.6, 0.8, -1.4); }
  else if (!G.dialog) { if (L1.roverMode()) L1.updateRover(dt); else { updatePlayer(dt); followCamera(dt); } }
  if (G.scene === 'level1') L1.update(dt, time);
  if (girl.visible) animateGirl(girl, G.cine ? 0 : P.speed, dt, !P.onGround && !G.cine, time);
  if (nuri.visible) { animateNuri(nuri, time, dt); if (G.nuriJoined && !G.cine) updateNuriFollow(dt); }
  if (ship.visible) animateShip(ship, time);
  if (G.scene === 'bedroom' || G.scene === 'title') { const b = ENV.bedroom.userData.box; if (!G.boxOpened) { b.root.position.y = Math.abs(Math.sin(time * 2.5)) * 0.04; boxLight.position.set(b.root.position.x, 0.9, b.root.position.z); if (Math.random() < dt * 4) burst(new T.Vector3(b.root.position.x + (Math.random() - 0.5) * 0.6, 0.6, b.root.position.z + (Math.random() - 0.5) * 0.6), 0x8fd0ef, 1, 0.2, 0.5); } ENV.bedroom.userData.globe.rotation.y = time * 0.3; }
  if (G.scene === 'desert' && G.control && !G.nuriMet) { G.desertTime += dt; const d = Math.hypot(P.pos.x - NURI_ROCK.x, P.pos.z - NURI_ROCK.z); if (d < 7.5 || G.desertTime > 16) meetNuri(); }
  if (G.scene === 'desert' || G.scene === 'landing' || G.scene === 'level1') { sun.position.copy(P.pos).add(new T.Vector3(30, 26, 18)); sun.target.position.copy(P.pos); }
  if (G.scene === 'yard') { sun.position.set(P.pos.x - 20, 30, P.pos.z - 20); sun.target.position.copy(P.pos); }
  sky.position.copy(camera.position); stars.position.copy(camera.position);
  updateSparks(dt);
  updateActionUI();
  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}

// ============================== Boot ==============================
setEnv('bedroom'); G.scene = 'title';
P.pos.set(-0.4, 0, 0.4); P.yaw = 0.6; girl.position.copy(P.pos); girl.rotation.y = P.yaw;
$('loading').remove(); resize(); applyLang(); $('titleScreen').hidden = false;
requestAnimationFrame(loop);
(async () => {
  if (!window.claude?.use) return;
  try { sample = await window.claude.use('sample'); } catch (e) { sample = null; }
  try { tts = await window.claude.use('tts'); } catch (e) { tts = null; }
  if (tts) $('voiceBtn').hidden = false;
  if (!$('chat').hidden) openChat();
})();
})();
</script>
