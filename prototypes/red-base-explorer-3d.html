<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>html{color-scheme:light}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style></head><body>
<meta charset="utf-8">
<title>Red Base Explorer</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: one-screen game. A 3D Mars viewport fills the stage; HUD sits on its corners; decisions slide in as a side panel (bottom sheet on phones). */
:root {
  color-scheme: dark;
  --night: #140e0d;
  --panel: #1e1614;
  --panel-2: #291e1b;
  --line: #3e2d29;
  --ink: #f3e7dc;
  --muted: #b5a094;
  --rust: #d2602c;
  --butter: #e3b47a;
  --sunset: #8cbbe0;
  --ok: #86c98f;
  --bad: #ec5a50;
  --glass: rgba(18, 12, 11, .66);
  --r-o2: #9ad6ea; --r-water: #5a9be0; --r-food: #8fc66c; --r-power: #ecc24c; --r-health: #ee7f82; --r-science: #e3b47a;
  --f-display: "Chakra Petch", "Segoe UI", system-ui, sans-serif;
  --f-body: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, Consolas, monospace;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body {
  background: var(--night); color: var(--ink); font-family: var(--f-body); font-size: 15px; line-height: 1.5;
  display: flex; flex-direction: column; gap: 10px; overflow: hidden;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 10px 14px;
}
.topbar { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 4px 18px; flex: none; }
.brand { font-family: var(--f-display); font-weight: 700; font-size: 22px; letter-spacing: .04em; text-transform: uppercase; line-height: 1.1; }
.brand span { color: var(--rust); }
.meta { display: flex; flex-wrap: wrap; gap: 4px 16px; font-family: var(--f-mono); font-size: 12px; color: var(--muted); }
.meta b { color: var(--ink); font-weight: 500; }

.stage { position: relative; flex: 1; min-height: 0; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; background: #c99a6b; touch-action: none; user-select: none; -webkit-user-select: none; }
.stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; cursor: grab; }
.stage canvas:active { cursor: grabbing; }
.vignette { position: absolute; inset: 0; pointer-events: none; transition: box-shadow .6s; }
.vignette.flare { box-shadow: inset 0 0 120px 30px rgba(180, 130, 255, .45); animation: flare 1.4s ease-in-out infinite; }
@keyframes flare { 50% { box-shadow: inset 0 0 160px 50px rgba(200, 150, 255, .6); } }

/* HUD */
.hud-tl { position: absolute; left: 10px; top: 10px; width: 206px; background: var(--glass); border: 1px solid rgba(255,255,255,.1); border-radius: 5px; padding: 10px 12px; display: flex; flex-direction: column; gap: 7px; backdrop-filter: blur(4px); pointer-events: none; }
.g { display: grid; grid-template-columns: 1fr auto; gap: 2px 8px; font-size: 12px; position: relative; }
.g .v { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
.g .bar { grid-column: 1 / -1; height: 5px; background: rgba(255,255,255,.1); border-radius: 2px; overflow: hidden; }
.g .fill { height: 100%; background: var(--c); transition: width .7s cubic-bezier(.2,.8,.2,1); }
.g.low .v { color: var(--bad); }
.g.low .fill { animation: pulse 1s ease-in-out infinite; }
@keyframes pulse { 50% { opacity: .4; } }
.sci { display: flex; justify-content: space-between; align-items: baseline; border-top: 1px dashed rgba(255,255,255,.15); padding-top: 6px; font-size: 12px; position: relative; }
.sci b { font-family: var(--f-display); font-size: 20px; color: var(--r-science); font-variant-numeric: tabular-nums; }
.delta { position: absolute; right: 30px; top: -3px; font-family: var(--f-mono); font-size: 11px; padding: 0 4px; border-radius: 2px; animation: rise 1.8s ease-out forwards; }
.delta.up { background: var(--ok); color: #0f1a10; } .delta.down { background: var(--bad); color: #2a0c0a; }
@keyframes rise { 0% { opacity: 0; transform: translateY(5px); } 15% { opacity: 1; transform: none; } 75% { opacity: 1; } 100% { opacity: 0; transform: translateY(-7px); } }

.hud-tr { position: absolute; right: 10px; top: 10px; display: flex; flex-direction: column; align-items: flex-end; gap: 6px; pointer-events: none; }
.pips { display: flex; gap: 3px; }
.pips i { width: 16px; height: 6px; border-radius: 1px; background: rgba(255,255,255,.22); display: block; }
.pips i.done { background: var(--butter); } .pips i.now { background: var(--rust); box-shadow: 0 0 0 1px rgba(255,255,255,.5); }
.chip { font-family: var(--f-mono); font-size: 11.5px; background: var(--glass); border: 1px solid rgba(255,255,255,.12); padding: 2px 8px; border-radius: 3px; }
.chip.alert { border-color: var(--bad); color: #ffd2cd; }

.objective { position: absolute; left: 50%; top: 10px; transform: translateX(-50%); max-width: min(420px, calc(100% - 460px)); text-align: center; background: var(--glass); border: 1px solid rgba(227,180,122,.45); border-radius: 4px; padding: 6px 14px; pointer-events: none; }
.objective .k { font-family: var(--f-mono); font-size: 10.5px; letter-spacing: .12em; text-transform: uppercase; color: var(--butter); }
.objective .t { font-size: 13.5px; font-weight: 600; text-wrap: balance; }
.marker { position: absolute; left: 0; top: 0; transform: translate(-50%, -100%); pointer-events: none; display: flex; flex-direction: column; align-items: center; gap: 2px; }
.marker .dm { width: 14px; height: 14px; border: 2px solid var(--butter); background: rgba(210,96,44,.85); transform: rotate(45deg); box-shadow: 0 0 10px rgba(227,180,122,.7); }
.marker .lb { font-family: var(--f-mono); font-size: 11px; background: var(--glass); padding: 1px 6px; border-radius: 2px; white-space: nowrap; }

.prompt { all: unset; position: absolute; left: 50%; bottom: 18px; transform: translateX(-50%); background: var(--rust); color: #1b0c06; font-family: var(--f-display); font-weight: 600; letter-spacing: .06em; text-transform: uppercase; font-size: 14px; padding: 10px 18px; border-radius: 4px; cursor: pointer; box-shadow: 0 6px 20px rgba(0,0,0,.35); display: flex; gap: 10px; align-items: center; white-space: nowrap; max-width: calc(100% - 24px); }
.prompt kbd { font-family: var(--f-mono); background: rgba(0,0,0,.2); border-radius: 3px; padding: 1px 7px; font-size: 13px; }
.prompt:focus-visible { outline: 2px solid var(--sunset); outline-offset: 3px; }
.toast { position: absolute; left: 50%; top: 74px; transform: translateX(-50%); width: min(380px, calc(100% - 24px)); background: var(--glass); border: 1px solid rgba(140,187,224,.5); border-radius: 4px; padding: 8px 12px; font-size: 13px; pointer-events: none; transition: opacity .4s; }
.toast b { color: var(--sunset); display: block; font-family: var(--f-mono); font-size: 11px; letter-spacing: .1em; text-transform: uppercase; font-weight: 500; }
.help { position: absolute; left: 10px; bottom: 10px; font-family: var(--f-mono); font-size: 11px; color: rgba(255,240,230,.85); background: var(--glass); padding: 4px 9px; border-radius: 3px; pointer-events: none; }
.stick { position: absolute; left: 18px; bottom: 18px; width: 116px; height: 116px; border-radius: 50%; border: 2px solid rgba(255,255,255,.3); background: rgba(20,12,10,.35); touch-action: none; }
.stick .nub { position: absolute; left: 50%; top: 50%; width: 46px; height: 46px; margin: -23px 0 0 -23px; border-radius: 50%; background: rgba(243,231,220,.75); }
.jump { all: unset; position: absolute; right: 18px; bottom: 26px; width: 70px; height: 70px; border-radius: 50%; background: rgba(20,12,10,.5); border: 2px solid rgba(255,255,255,.35); font-family: var(--f-display); font-size: 13px; text-transform: uppercase; display: grid; place-items: center; cursor: pointer; }

/* Decision panel */
.panel { position: absolute; right: 10px; top: 10px; bottom: 10px; width: min(440px, calc(100% - 20px)); background: rgba(30, 22, 20, .97); border: 1px solid var(--line); border-radius: 6px; padding: 20px 22px 22px; display: flex; flex-direction: column; gap: 13px; overflow-y: auto; box-shadow: 0 10px 40px rgba(0,0,0,.45); animation: slide .35s cubic-bezier(.2,.8,.2,1); }
@keyframes slide { from { opacity: 0; transform: translateX(16px); } to { opacity: 1; transform: none; } }
@media (max-width: 760px) {
  .panel { left: 8px; right: 8px; top: auto; bottom: 8px; width: auto; max-height: 68%; padding: 16px; }
  .objective { top: auto; bottom: 150px; max-width: calc(100% - 24px); }
  .hud-tl { width: 160px; padding: 8px 10px; gap: 5px; }
  .brand { font-size: 18px; }
  .toast { top: auto; bottom: 200px; }
  .prompt { bottom: 110px; }
}
.eyebrow { font-family: var(--f-mono); font-size: 11.5px; letter-spacing: .08em; text-transform: uppercase; color: var(--rust); }
.panel h2 { font-family: var(--f-display); font-weight: 600; font-size: 24px; line-height: 1.15; margin: 0; text-wrap: balance; }
.story { margin: 0; color: #e6d7cb; font-size: 14.5px; }
.banner { border-left: 3px solid var(--sunset); background: rgba(140,187,224,.08); padding: 9px 12px; font-size: 13.5px; border-radius: 0 4px 4px 0; }
.choices { display: flex; flex-direction: column; gap: 8px; }
.choice { all: unset; box-sizing: border-box; cursor: pointer; display: grid; grid-template-columns: 28px 1fr; gap: 3px 11px; padding: 11px 12px; border: 1px solid var(--line); border-radius: 5px; background: var(--panel-2); transition: border-color .15s, background .15s; }
.choice:hover { border-color: var(--butter); background: #33241f; }
.choice:focus-visible { outline: 2px solid var(--sunset); outline-offset: 2px; }
.choice .key { grid-row: 1 / 3; font-family: var(--f-display); font-weight: 700; width: 28px; height: 28px; display: grid; place-items: center; border: 1px solid var(--line); border-radius: 3px; color: var(--butter); }
.choice .t { font-weight: 600; font-size: 14.5px; }
.choice .d { font-size: 13px; color: var(--muted); }
.tags { grid-column: 2; display: flex; flex-wrap: wrap; gap: 4px; margin-top: 3px; }
.tag { font-family: var(--f-mono); font-size: 11px; padding: 0 5px; border-radius: 2px; border: 1px solid; }
.tag.up { color: var(--ok); border-color: rgba(134,201,143,.4); } .tag.down { color: #f19a92; border-color: rgba(236,90,80,.45); } .tag.note { color: var(--sunset); border-color: rgba(140,187,224,.4); }
.fact { border: 1px solid rgba(227,180,122,.35); background: rgba(227,180,122,.05); border-radius: 5px; padding: 12px 14px; display: flex; flex-direction: column; gap: 5px; }
.fact .ft { font-family: var(--f-display); font-size: 11.5px; letter-spacing: .14em; text-transform: uppercase; color: var(--butter); }
.fact p { margin: 0; font-size: 14px; }
.fact .src { font-family: var(--f-mono); font-size: 11px; color: var(--muted); }
.btn { all: unset; box-sizing: border-box; cursor: pointer; align-self: flex-start; font-family: var(--f-display); font-weight: 600; letter-spacing: .08em; text-transform: uppercase; font-size: 13.5px; padding: 10px 18px; background: var(--rust); color: #1b0c06; border-radius: 4px; }
.btn:hover { filter: brightness(1.12); }
.btn:focus-visible { outline: 2px solid var(--sunset); outline-offset: 3px; }
.report { border: 1px solid var(--line); border-radius: 5px; overflow: hidden; }
.report div { display: grid; grid-template-columns: 1fr auto; gap: 10px; padding: 7px 11px; font-size: 13.5px; border-top: 1px solid var(--line); }
.report div:first-child { border-top: 0; }
.report .n { font-family: var(--f-mono); } .report .n.up { color: var(--ok); } .report .n.down { color: #f19a92; }
.crew { display: grid; grid-template-columns: repeat(2, 1fr); gap: 6px; }
.crew div { border: 1px solid var(--line); border-radius: 4px; padding: 6px 9px; background: var(--panel-2); font-size: 12.5px; }
.crew b { display: block; font-size: 13.5px; } .crew span { color: var(--muted); }
.keys { display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; font-size: 13px; }
.keys kbd { font-family: var(--f-mono); font-size: 12px; border: 1px solid var(--line); border-radius: 3px; padding: 0 6px; background: var(--panel-2); justify-self: start; }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
.stat { background: var(--panel-2); border: 1px solid var(--line); border-radius: 4px; padding: 7px 9px; }
.stat .k { font-size: 11.5px; color: var(--muted); } .stat .v { font-family: var(--f-display); font-size: 19px; font-weight: 700; }
.rank { font-family: var(--f-display); letter-spacing: .1em; text-transform: uppercase; color: var(--butter); }
.log { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 5px; font-size: 13.5px; }
.log b { font-family: var(--f-mono); font-weight: 500; color: var(--rust); font-size: 12px; margin-right: 8px; }
details.know { border: 1px solid var(--line); border-radius: 5px; background: var(--panel-2); }
details.know summary { cursor: pointer; padding: 9px 12px; font-weight: 600; font-size: 14px; }
details.know .inner { padding: 0 12px 12px; display: flex; flex-direction: column; gap: 8px; }
details.know p { margin: 0; font-size: 13.5px; } details.know p b { color: var(--butter); }
.loading { position: absolute; inset: 0; display: grid; place-items: center; font-family: var(--f-mono); color: #2a1a12; }
@media (prefers-reduced-motion: reduce) { .panel, .delta, .g.low .fill, .vignette.flare { animation: none; } }
</style>

<header class="topbar">
  <div class="brand">Red Base <span>Explorer</span></div>
  <div class="meta">
    <div>Jezero Crater, Mars</div>
    <div>Gravity <b>0.38 g</b></div>
    <div>Outside <b id="mTemp">−22 °C</b></div>
    <div>Signal to Earth <b id="mDelay">11 min</b></div>
  </div>
</header>

<main class="stage" id="stage">
  <div class="loading" id="loading">Loading Mars…</div>
  <div class="vignette" id="vignette"></div>
  <div class="hud-tl" id="gauges"></div>
  <div class="hud-tr"><div class="pips" id="pips"></div><div id="chips" style="display:flex;flex-direction:column;align-items:flex-end;gap:4px"></div></div>
  <div class="objective" id="objective" hidden><div class="k">Objective</div><div class="t" id="objText"></div></div>
  <div class="marker" id="marker" hidden><div class="lb" id="markerLbl"></div><div class="dm"></div></div>
  <div class="toast" id="toast" hidden></div>
  <button class="prompt" id="prompt" hidden></button>
  <div class="help" id="help" hidden>WASD / arrows move · Shift run · Space jump · drag to look · E use</div>
  <div class="stick" id="stick" hidden><div class="nub" id="nub"></div></div>
  <button class="jump" id="jumpBtn" hidden>Jump</button>
  <section class="panel" id="panel" aria-live="polite"></section>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(() => {
'use strict';
const $ = (id) => document.getElementById(id);
if (!window.THREE) { $('loading').textContent = 'The 3D engine could not load. Check your connection and reload.'; return; }
const T = THREE;

// =================== Game data ===================
const RES = [
  { k: 'o2', name: 'Oxygen', c: 'var(--r-o2)' },
  { k: 'water', name: 'Water', c: 'var(--r-water)' },
  { k: 'food', name: 'Food', c: 'var(--r-food)' },
  { k: 'power', name: 'Power', c: 'var(--r-power)' },
  { k: 'health', name: 'Crew health', c: 'var(--r-health)' },
];
const LABEL = { o2: 'O₂', water: 'Water', food: 'Food', power: 'Power', health: 'Health', science: 'Science' };
const DELAYS = [11, 11, 12, 12, 13, 13, 14];
const LOC = {
  lander:   { x: -24, z: 20 },
  moxie:    { x: 10.5, z: 5 },
  recycler: { x: -10, z: -4 },
  panels:   { x: 21, z: -5 },
  antenna:  { x: 13, z: 21 },
  leopard:  { x: -46, z: -58 },
  door:     { x: 0, z: 11.5 },
};

const SOLS = [
  { at: 'lander', goal: 'Unload the cargo at the lander', verb: 'Open the cargo bay', temp: '−22 °C',
    title: 'Touchdown in Jezero Crater',
    story: 'The cargo bay is full of parts, but there is daylight for only one big job before night. Jezero Crater is a dry lakebed where rivers flowed about 3.5 billion years ago. What do you build first?',
    choices: [
      { t: 'Unfold extra solar panels', d: 'More power every sol for the rest of the mission.', eff: () => ({ power: +4 }), note: '+5 power each night', set: { panels: true },
        out: 'Two more panels click open in the solar field and tilt toward the small, pale Sun. Go and look: the batteries will charge faster from tonight on.' },
      { t: 'Plant the greenhouse', d: 'Fresh food later, but plants need water now.', eff: () => ({ water: -8 }), note: '+4 food each night', set: { greenhouse: true },
        out: 'Lucas fills the growing trays in the greenhouse behind the habitat. The seedlings drink a lot today, but in a few sols they will feed the crew.' },
      { t: 'Cover the roof with Mars soil', d: 'Hard digging, but it shields the crew from radiation.', eff: () => ({ power: -6, health: -2 }), note: 'Blocks radiation later', set: { shield: true },
        out: 'Kenji drives the digger for hours and piles red soil over the habitat dome. Everyone is tired, but the roof is now a thick shield.' },
    ],
    fact: 'Mars gets only about 43% as much sunlight as Earth because it is about 1.5 times farther from the Sun. It has no global magnetic field and its air is about 1% as thick as ours, so space radiation reaches the ground. Soil can block it. Martian soil also contains toxic perchlorate salts, so plants are grown in washed soil or in water.',
    src: 'NASA Mars facts · Curiosity Radiation Assessment Detector' },
  { at: 'moxie', goal: 'Start the oxygen maker next to the habitat', verb: 'Use the oxygen maker', temp: '−25 °C',
    title: 'Oxygen from thin air',
    story: 'The air you breathe comes from tanks you brought from Earth, and the tanks are dropping. The air outside is 95% carbon dioxide. This machine can split CO₂ to release oxygen, but it needs a lot of electricity.',
    choices: [
      { t: 'Run it at full power', d: 'Lots of oxygen, big power bill.', eff: () => ({ o2: +16, power: -14 }), fx: { moxie: 2 },
        out: 'The machine hums all day and heats up to 800 °C inside. Watch the vapor puffing out. The oxygen tanks climb and the battery drops.' },
      { t: 'Run it at half power', d: 'A careful middle path.', eff: () => ({ o2: +8, power: -6 }), fx: { moxie: 1 },
        out: 'You run it gently. A steady trickle of oxygen flows into the tanks while the battery stays healthy.' },
      { t: 'Keep it off today', d: 'Save power and live on the tanks.', eff: () => ({}),
        out: 'The battery stays full, but the crew is breathing from the tanks with nothing coming in. Sofia keeps one eye on the oxygen bar.' },
    ],
    fact: 'This machine is real. NASA’s MOXIE experiment on the Perseverance rover made oxygen from martian air 16 times between 2021 and 2023, 122 grams in all, at up to 12 grams per hour. One person breathes about 0.84 kg of oxygen a day, so a crewed base would need a much bigger version.',
    src: 'NASA MOXIE, Perseverance rover · NASA life support design values' },
  { at: 'recycler', goal: 'Alarm! Check the water recycler behind the habitat', verb: 'Inspect the recycler', temp: '−18 °C', alarm: true,
    title: 'The water recycler stopped',
    story: 'BEEP. BEEP. BEEP. The water recycler has shut down. There is no tap on Mars. Every drop you drink, wash with and even breathe out as vapor has to be cleaned and used again.',
    choices: [
      { t: 'Fix it yourselves', d: 'Kenji knows the system, but it is a long, tiring repair.', eff: () => ({ water: +6, power: -4, health: -4 }),
        out: 'Kenji finds a clogged filter after four hours on his back under the machine. Water flows again and the alarm goes quiet.' },
      { t: 'Ask Mission Control for help', d: 'Engineers on Earth know every bolt, but the radio is slow.', eff: () => ({ water: -6 }), note: 'Answer arrives tomorrow', set: { askEarth: true },
        out: 'Your message races to Earth at the speed of light and still takes 12 minutes. Engineers test a fix on a copy of your machine. Their answer will arrive overnight. Until then, the tank drains.' },
      { t: 'Ration water until it is fixed', d: 'Save water, but thirsty crews get headaches.', eff: () => ({ water: +4, health: -10 }),
        out: 'Everyone gets a small cup. By evening the crew is grumpy and Sofia reports headaches. You saved water, but bodies paid for it.' },
    ],
    fact: 'The International Space Station recycles about 98% of its water, including sweat and urine, back into clean drinking water. On Mars, help from Earth is slow: radio signals take between about 3 and 22 minutes each way, so one question and answer can take most of an hour.',
    src: 'NASA ISS Environmental Control and Life Support System (2023)' },
  { at: 'panels', goal: 'A dust storm is coming. Check the solar field', verb: 'Inspect the panels', temp: '−15 °C', dust: 0.72,
    title: 'A dust storm rolls in',
    story: 'The horizon has turned brown and the sky is darkening at noon. Fine dust is settling on the solar panels and the power meter keeps falling.',
    choices: [
      { t: 'Brush the panels clean', d: 'Hard work in a spacesuit during a storm.', eff: () => ({ power: +10, health: -6 }), dust: 0.45,
        out: 'You and Kenji sweep the panels with long brushes while the wind pushes you sideways. Power comes back up, and you are both coated in red.' },
      { t: 'Shut down the science lab', d: 'Save every watt for heat and air.', eff: () => ({ power: +8 }),
        out: 'The lab goes dark. The base is quiet and cold, but the batteries will last. No discoveries today.' },
      { t: 'Keep everything running', d: 'The work continues, and so does the drain.', eff: () => ({ power: -8, science: +10 }),
        out: 'The lab keeps analyzing rock samples and finds layers left by an ancient lake. The battery, though, sinks fast in the dim light.' },
    ],
    fact: 'Dust storms on Mars can grow until they cover the whole planet. In 2018 a planet-wide storm blocked sunlight for months, and the solar-powered rover Opportunity went silent after almost 15 years of exploring. Sometimes martian winds and dust devils also blew dust off rover panels, giving them surprise power boosts.',
    src: 'NASA Mars Exploration Rover Opportunity' },
  { at: 'antenna', goal: 'Urgent message waiting at the comms antenna', verb: 'Read the message', temp: '−21 °C', flare: true,
    title: 'Warning: solar storm',
    story: 'Urgent message from Earth: the Sun has blasted out a cloud of fast particles headed for Mars. Because of the radio delay, this warning took 13 minutes to reach you. Amal and Lucas are out at the rock outcrop collecting samples.',

function hash(x, z) { const s = Math.sin(x * 127.1 + z * 311.7) * 43758.5453; return s - Math.floor(s); }
function vnoise(x, z) {
  const xi = Math.floor(x), zi = Math.floor(z), xf = x - xi, zf = z - zi;
  const u = xf * xf * (3 - 2 * xf), v = zf * zf * (3 - 2 * zf);
  const a = hash(xi, zi), b = hash(xi + 1, zi), c = hash(xi, zi + 1), d = hash(xi + 1, zi + 1);
  return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v;
}
function fbm(x, z) { let s = 0, a = 0.5, f = 1; for (let i = 0; i < 4; i++) { s += a * vnoise(x * f, z * f); f *= 2.03; a *= 0.5; } return s; }
const smooth = (a, b, x) => { const t = Math.max(0, Math.min(1, (x - a) / (b - a))); return t * t * (3 - 2 * t); };
const CRATERS = [{ x: 55, z: 40, r: 14, d: 3 }, { x: -70, z: 30, r: 9, d: 2 }, { x: 30, z: -70, r: 18, d: 4 }, { x: -20, z: 75, r: 7, d: 1.6 }, { x: 85, z: -20, r: 10, d: 2.2 }];
function height(x, z) {
  const d = Math.hypot(x, z);
  let h = (fbm(x * 0.018, z * 0.018) - 0.5) * 9 + (fbm(x * 0.09 + 7, z * 0.09) - 0.5) * 1.4;
  for (const c of CRATERS) {
    const q = Math.hypot(x - c.x, z - c.z) / c.r;
    if (q < 1.6) h += (q < 1 ? -c.d * (1 - q * q) : 0) + c.d * 0.6 * Math.exp(-((q - 1) ** 2) / 0.025);
  }
  h *= smooth(16, 38, d);
  h += 34 * smooth(150, 205, d) + (fbm(x * 0.03, z * 0.03) - 0.5) * 18 * smooth(150, 205, d);
  // flatten around the leopard rock and lander for walkability
  return h;
}

const START_YAW = -0.53; // looks from the spawn point toward the habitat

const keys = {}; const stick = { x: 0, y: 0 };
const coarse = matchMedia('(pointer: coarse)').matches;

// camera drag

// touch joystick

let stickId = null;
const stickEl = $('stick'), nub = $('nub');
stickEl.addEventListener('pointerdown', (e) => { stickId = e.pointerId; stickEl.setPointerCapture(e.pointerId); moveStick(e); });

function moveStick(e) {
  const r = stickEl.getBoundingClientRect(); let dx = e.clientX - (r.left + r.width / 2), dy = e.clientY - (r.top + r.height / 2);
  const m = r.width / 2 - 12, l = Math.hypot(dx, dy); if (l > m) { dx *= m / l; dy *= m / l; }
  stick.x = dx / m; stick.y = dy / m; nub.style.transform = `translate(${dx}px, ${dy}px)`;

const GRAV = 3.71; // m/s² on Mars
function jump() { if (P.onGround && !panelOpen()) { P.vy = 4.2; P.onGround = false; } }

function updatePlayer(dt) {
  let ix = 0, iz = 0;
  if (!panelOpen()) {
    if (keys.KeyW || keys.ArrowUp) iz += 1; if (keys.KeyS || keys.ArrowDown) iz -= 1;
    if (keys.KeyA || keys.ArrowLeft) ix -= 1; if (keys.KeyD || keys.ArrowRight) ix += 1;
    ix += stick.x; iz -= stick.y;
  }
  const len = Math.hypot(ix, iz); if (len > 1) { ix /= len; iz /= len; }
  const run = keys.ShiftLeft || keys.ShiftRight || Math.hypot(stick.x, stick.y) > 0.92;
  const maxS = run ? 7.5 : 4.2;
  // camera-relative directions
  const fx = -Math.sin(camYaw), fz = -Math.cos(camYaw), rx = -fz, rz = fx;
  const tx = (fx * iz + rx * ix) * maxS, tz = (fz * iz + rz * ix) * maxS;
  const acc = P.onGround ? 10 : 3;
  P.vel.x += (tx - P.vel.x) * Math.min(1, acc * dt); P.vel.z += (tz - P.vel.z) * Math.min(1, acc * dt);
  P.pos.x += P.vel.x * dt; P.pos.z += P.vel.z * dt;
  // collisions
  for (const s of solids) {
    if (s.panel !== undefined && !panelMeshes[s.panel].g.visible) continue;
    const dx = P.pos.x - s.x, dz = P.pos.z - s.z, d = Math.hypot(dx, dz), m = s.r + 0.45;
    if (d < m && d > 0.0001) { P.pos.x = s.x + dx / d * m; P.pos.z = s.z + dz / d * m; }
  }
  const R = Math.hypot(P.pos.x, P.pos.z); if (R > 160) { P.pos.x *= 160 / R; P.pos.z *= 160 / R; }
  const gy = groundAt(P.pos.x, P.pos.z);
  P.vy -= GRAV * dt; P.pos.y += P.vy * dt;
  if (P.pos.y <= gy) { P.pos.y = gy; P.vy = 0; P.onGround = true; } else if (P.pos.y - gy > 0.05) P.onGround = false;
  P.speed = Math.hypot(P.vel.x, P.vel.z);
  if (P.speed > 0.3) { const want = Math.atan2(P.vel.x, P.vel.z); let d = want - P.yaw; d = Math.atan2(Math.sin(d), Math.cos(d)); P.yaw += d * Math.min(1, dt * 10); }

}

function updateCamera(dt) {
  const target = new T.Vector3(P.pos.x, P.pos.y + 1.7, P.pos.z);
  const cx = target.x + Math.sin(camYaw) * Math.cos(camPitch) * camDist;
  const cz = target.z + Math.cos(camYaw) * Math.cos(camPitch) * camDist;
  let cy = target.y + Math.sin(camPitch) * camDist;
  cy = Math.max(cy, groundAt(cx, cz) + 0.8);
  camera.position.lerp(new T.Vector3(cx, cy, cz), Math.min(1, dt * 8));

}

// =================== Objectives & interaction ===================
let near = null; // current interactable { label, fn }

  if (S.phase === 'return') return { at: LOC.door, text: `Head back to the habitat airlock to end sol ${S.sol + 1}`, verb: S.sol === 6 ? 'Sleep before launch' : `Sleep and end sol ${S.sol + 1}`, fn: nightfall };

}

$('prompt').addEventListener('click', () => interact());

const v3 = new T.Vector3();

  x = Math.max(40, Math.min(W - 40, x)); y = Math.max(60, Math.min(H - 40, y));

// =================== Game logic ===================
function apply(eff) {
  const deltas = {};
  for (const [k, v] of Object.entries(eff)) {
    if (!v) continue;
    if (k === 'science') { S.science = Math.max(0, S.science + v); deltas.science = v; }
    else { const b = S.res[k]; S.res[k] = clamp(b + v); deltas[k] = S.res[k] - b; }
  }

}
const failed = () => RES.find((r) => S.res[r.k] <= 0);
function tagsFor(eff) { return Object.entries(eff).filter(([, v]) => v).map(([k, v]) => `<span class="tag ${v > 0 ? 'up' : 'down'}">${LABEL[k]} ${fmt(v)}</span>`).join(''); }

function openEvent() { S.phase = 'event'; render(); }
function choose(i) {
  const ev = SOLS[S.sol], ch = ev.choices[i];
  S.last = i; S.decisions.push({ sol: S.sol + 1, t: ch.t });

  if (ch.dust !== undefined) S.dust = ch.dust;
  S.fx = Object.assign({}, ch.fx || {});
  if (S.fx.rover) S.fx.roverT = 0;
  const d = apply(ch.eff(S));

}

  const panels = S.flags.panels ? 5 : 0, solar = Math.round(14 * (1 - S.dust)) + panels;
  const rows = [
    { what: 'Crew breathed through the night', k: 'o2', v: -7 },
    { what: 'Drinking, cooking and washing', k: 'water', v: -5 },
    { what: 'Four crew meals', k: 'food', v: -6 },
  ];
  if (S.flags.greenhouse && S.sol >= 1) rows.push({ what: 'Greenhouse harvest', k: 'food', v: +4 });
  rows.push({ what: `Solar charge today${S.dust > 0.3 ? ' (dusty sky)' : ''}${panels ? ', extra panels' : ''}`, k: 'power', v: solar });
  rows.push({ what: 'Heaters and life support', k: 'power', v: -14 });
  const tot = {}; rows.forEach((r) => (tot[r.k] = (tot[r.k] || 0) + r.v));
  const d = apply(tot);
  if (S.res.power < 15) { apply({ health: -5 }); d.health = (d.health || 0) - 5; rows.push({ what: 'Low power: heaters ran weak in −78 °C cold', k: 'health', v: -5 }); }
  if (S.res.food < 12) { apply({ health: -3 }); d.health = (d.health || 0) - 3; rows.push({ what: 'Hungry crew', k: 'health', v: -3 }); }

  } else if (S.phase === 'night') {
    p.innerHTML = `
      <div class="eyebrow">Sol ${S.sol + 1} · Night report</div><h2>The Sun sets blue over Jezero</h2>
      <p class="story">Martian sunsets glow blue because fine dust scatters blue light forward, toward your eyes. Overnight the crew sleeps, breathes and eats, and the heaters fight the cold.</p>
      <div class="report">${S.night.map((r) => `<div><span>${r.what}</span><span class="n ${r.v > 0 ? 'up' : 'down'}">${fmt(r.v)} ${LABEL[r.k]}</span></div>`).join('')}</div>
      <button class="btn" id="go">${S.abort ? 'See mission report' : S.sol === 6 ? 'Launch to orbit' : 'Wake up for sol ' + (S.sol + 2)}</button>`;
    $('go').onclick = wake; $('go').focus({ preventScroll: true });
  } else if (S.phase === 'end') {
    const ok = !S.abort;
    const total = S.science + (ok ? Math.round(Object.values(S.res).reduce((a, b) => a + b, 0) / 5) : 0);
    const rank = !ok ? 'Cadet · try again' : S.science >= 60 ? 'Flight Commander' : S.science >= 30 ? 'Mission Specialist' : 'Base Keeper';
    p.innerHTML = `
      <div class="eyebrow">Mission report</div>
      <h2>${ok ? 'All four crew are safe in orbit' : `Mission aborted on sol ${S.sol + 1}`}</h2>
      <p class="story">${ok ? 'The ascent vehicle lifts off and the base shrinks to a dot on the red plain. You kept a crew alive on another planet for seven sols.'
        : `${S.abort.name} ran out, so the crew had to leave for the orbiting ship early. Real missions plan for this with reserves and backup systems. Look at which choices drained ${S.abort.name.toLowerCase()} and try a different path.`}</p>
      <div class="rank">Rank: ${rank}</div>
      <div class="stats"><div class="stat"><div class="k">Science</div><div class="v">${S.science}</div></div><div class="stat"><div class="k">Samples</div><div class="v">${S.collected.length}/${samples.length}</div></div><div class="stat"><div class="k">Score</div><div class="v">${total}</div></div>
      ${RES.map((r) => `<div class="stat"><div class="k">${r.name}</div><div class="v">${S.res[r.k]}</div></div>`).join('')}</div>
      <ol class="log">${S.decisions.map((d) => `<li><b>Sol ${d.sol}</b>${d.t}</li>`).join('')}</ol>
      <details class="know"><summary>What you learned (${S.decisions.length + S.collected.length} facts)</summary><div class="inner">
        ${S.decisions.map((d) => `<p><b>${SOLS[d.sol - 1].title}.</b> ${SOLS[d.sol - 1].fact}</p>`).join('')}
        ${S.collected.map((i) => `<p><b>Rock sample.</b> ${SAMPLE_FACTS[i]}</p>`).join('')}</div></details>
      <p class="story" style="font-size:13.5px">On Mars nothing is free. Power, air, water, food, health and discovery all pull against each other, and every gram carried from Earth is expensive. Choosing which trade-off to make is the real job of a mission team.</p>
      <button class="btn" id="again">Fly again</button>`;
    $('again').onclick = () => { S = fresh(); samples.forEach((s) => (s.g.visible = true)); P.pos.set(-14, 0, 24); P.pos.y = groundAt(-14, 24); camYaw = START_YAW; renderGauges(); render(); };
  }
}

// =================== World state sync ===================
const cTmp = new T.Color(), cTmp2 = new T.Color();
let tod = 0;
function updateWorld(t, dt) {
  const nightTarget = S.phase === 'night' || (S.phase === 'end' && S.abort) ? 1 : 0;
  tod += (nightTarget - tod) * Math.min(1, dt * 0.9);
  const dustK = S.dust;
  // sky color
  if (tod < 0.5) cTmp.copy(SKY.day).lerp(SKY.dusk, tod * 2); else cTmp.copy(SKY.dusk).lerp(SKY.night, (tod - 0.5) * 2);
  cTmp.lerp(SKY.dust, Math.min(1, dustK * 1.25) * (1 - tod));
  scene.background.copy(cTmp); scene.fog.color.copy(cTmp);
  scene.fog.near = 70 - dustK * 62; scene.fog.far = 300 - dustK * 230;
  sun.intensity = 1.5 * (1 - tod) * (1 - dustK * 0.6);
  hemi.intensity = 0.65 - tod * 0.45;
  hemi.color.set(tod > 0.5 ? 0x8aa0d0 : 0xffe2c4);
  // sun follows the player for crisp shadows
  sun.position.copy(P.pos).addScaledVector(SUN_DIR, 80); sun.target.position.copy(P.pos);
  const sunPos = SUN_DIR.clone().multiplyScalar(340); sunPos.y -= tod * 260;
  sunDisc.position.copy(P.pos).add(sunPos); sunDisc.material.opacity = Math.max(0, 1 - tod * 1.4) * (1 - dustK * 0.7);
  stars.position.copy(P.pos); starMat.opacity = Math.max(0, tod - 0.45) * 1.6;
  earth.position.copy(P.pos).add(new T.Vector3(-150, 90, -260)); earth.material.opacity = starMat.opacity;
  windows.forEach((w) => (w.material.emissiveIntensity = 0.3 + tod * 2));
  // dust particles
  dMat.opacity = dustK > 0.25 ? dustK * 0.85 : 0;
  if (dMat.opacity) { const a = dGeo.attributes.position.array;
    for (let i = 0; i < DN; i++) { a[i * 3] += dt * 9 * dustK; if (a[i * 3] > 45) a[i * 3] -= 90; a[i * 3 + 1] -= dt * 0.5; if (a[i * 3 + 1] < 0) a[i * 3 + 1] += 18; }
    dGeo.attributes.position.needsUpdate = true; dust.position.set(P.pos.x, P.pos.y, P.pos.z); }
  // panels: count and dust
  panelMeshes.forEach((pm, i) => { pm.g.visible = i < (S.flags.panels ? 5 : 3); cTmp2.set(0x1d3a66).lerp(new T.Color(0x8a5532), dustK * 0.85); pm.p.material.color.copy(cTmp2); });
  shield.visible = S.flags.shield;
  plants.visible = S.flags.greenhouse;
  plants.children.forEach((pl) => { const g = pl.userData.base + Math.min(0.7, S.sol * 0.1); pl.scale.setScalar(g); });
  // alarms
  const blink = Math.sin(t * 9) > 0;
  M.red.emissiveIntensity = alarmOn() && blink ? 2.5 : 0;
  // flare tint
  if (flareOn()) hemi.color.set(blink ? 0xd9b8ff : 0xffe2c4);
  // MOXIE puffs
  const mx = S.fx.moxie || 0;
  puffs.forEach((p, i) => { if (!mx || i >= mx * 7) { p.material.opacity = 0; return; } const ph = (t * 0.35 + p.userData.ph) % 1;
    p.position.set(mox.position.x + 0.4 + Math.sin(ph * 6 + i) * 0.3, 2.2 + ph * 5, mox.position.z + 0.3); p.scale.setScalar(1 + ph * 3); p.material.opacity = 0.55 * (1 - ph); });
  // NPCs at outcrop on sol 5
  const npcOut = S.sol === 4 && ['explore', 'event'].includes(S.phase) || (S.sol === 4 && S.phase === 'outcome' && S.last === 1);
  npcA.visible = npcB.visible = npcOut;
  if (npcOut) { animateAstro(npcA, 0.6, dt, false); npcB.userData.armR.rotation.x = -1 + Math.sin(t * 2) * 0.3; }
  // rover trip
  if (S.fx.rover) { S.fx.roverT = Math.min(1, (S.fx.roverT || 0) + dt * 0.05);
    const to = new T.Vector3(LOC.leopard.x + 4, 0, LOC.leopard.z + 4), k = S.fx.roverT;
    rover.position.lerpVectors(ROVER_HOME, to, k); rover.position.y = groundAt(rover.position.x, rover.position.z);
    rover.rotation.y = Math.atan2(to.x - ROVER_HOME.x, to.z - ROVER_HOME.z) - Math.PI / 2;
  } else if (S.phase === 'night' || S.phase === 'explore') { rover.position.copy(ROVER_HOME); rover.position.y = groundAt(27, 13); rover.rotation.y = -0.8; }
  drone.visible = !!S.fx.drone;
  if (drone.visible) { drone.position.set(LOC.leopard.x - 2 + Math.sin(t * 0.7) * 3, groundAt(LOC.leopard.x, LOC.leopard.z) + 5 + Math.sin(t * 2) * 0.4, LOC.leopard.z - 2 + Math.cos(t * 0.7) * 3); rotorA.rotation.y = t * 40; rotorB.rotation.y = -t * 40; }
  if (S.fx.flag) flagPole.visible = true;
  if (S.phase === 'intro' && S.sol === 0) flagPole.visible = false;
}

// =================== Loop ===================
function resize() {
  const w = stage.clientWidth, h = stage.clientHeight; if (!w || !h) return;
  renderer.setSize(w, h, false); camera.aspect = w / h; camera.updateProjectionMatrix();
}
new ResizeObserver(resize).observe(stage);
const clock = new T.Clock();
let chromeTimer = 0;
function loop() {
  const dt = Math.min(0.05, clock.getDelta()), t = clock.elapsedTime;
  updatePlayer(dt); updateCamera(dt); updateWorld(t, dt); updateSamples(t); updateObjective(t);
  chromeTimer += dt; if (chromeTimer > 0.5) { chromeTimer = 0; renderChrome(); }
  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}

function start(data) {
  if (data && data.S) { S = data.S; if (data.P) P.pos.set(data.P.x, data.P.y, data.P.z); samples.forEach((s) => (s.g.visible = !S.collected.includes(s.i))); }
  $('loading').remove();
  buildGauges(); renderGauges(); render(); resize();
  camera.position.set(P.pos.x + 8, P.pos.y + 5, P.pos.z + 8);
  requestAnimationFrame(loop);
}
try { window.claude?.hot?.snapshot?.(() => ({ S, P: { x: P.pos.x, y: P.pos.y, z: P.pos.z } })); } catch (e) {}
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
})();
</script>

</body></html>
